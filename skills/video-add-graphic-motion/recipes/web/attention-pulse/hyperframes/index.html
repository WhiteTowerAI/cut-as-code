<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>attention-pulse - HyperFrames</title>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>attention-pulse · motion-anything recipe</title>
  <link rel="stylesheet" href="source/attention-pulse.css" />
  <style>
    :root { color-scheme: light; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; gap:30px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, #fff, #f4f5f7); color:#1a1d24; }
    .badge { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#8b909a; }
    .cta { border:0; background:#8b7cf6; color:#fff; padding:14px 26px; border-radius:14px; font-size:16px; font-weight:600; }
    .bell { position:relative; width:44px; height:44px; border-radius:12px; background:#fff; border:1px solid #ececf1;
      display:grid; place-items:center; font-size:20px; }
    .dot { position:absolute; top:-3px; right:-3px; width:12px; height:12px; border-radius:50%; background:#e0683c; }
  </style>

  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body[data-composition-id] { position: relative; box-sizing: border-box; background: transparent !important; }
  </style>
</head>
<body data-composition-id="attention-pulse" data-start="0" data-width="1920" data-height="1080" data-duration="6" data-no-timeline>

  <div style="text-align:center">
    
  </div>
  <button class="cta" data-pulse>Start free</button>
  <div class="bell">🔔<span class="dot" data-pulse style="--pulse-color:#e0683c"></span></div>

  <script src="hf-recipe.js"></script>
  <script src="hf-adapter.js"></script>
</body>
</html>
