spec_version: 1
id: line-md-folder-music-twotone
name: "Folder Music (Twotone)"
description: "A compact folder music icon uses draw-in, morph, fade motion to illustrate audio, video, music, volume, or media playback."
surfaces: [video]
category: sticker-media
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-media
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["folder", "music", "draw-in", "morph", "fade", "media", "audio", "playback", "twotone"]
intent_keywords:
  - "folder music"
  - "folder music icon"
  - "folder music symbol"
  - "folder music animation"
  - "folder music visual cue"
  - "show folder music"
  - "animated folder music"
  - "文件夹"
  - "文件夹图标"
  - "文件夹动画"
  - "文件夹提示"
best_for:
  - "A spoken reference to folder music needs a compact, immediately recognizable cue"
  - "The narration directly discusses sound, music, video, volume, or playback"
avoid_when:
  - "The spoken meaning does not refer to folder music or a close synonym"
  - "Media controls are visible in the footage but not relevant to the spoken meaning"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
