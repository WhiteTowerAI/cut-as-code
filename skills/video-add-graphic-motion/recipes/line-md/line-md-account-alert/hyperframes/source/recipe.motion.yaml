spec_version: 1
id: line-md-account-alert
name: "Account Alert"
description: "A compact account alert icon uses draw-in, looping motion to illustrate danger, risk, failure, caution, or an urgent problem."
surfaces: [video]
category: sticker-warning
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-warning
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["account", "alert", "draw-in", "looping", "warning", "urgent", "caution", "compact"]
intent_keywords:
  - "account alert"
  - "account alert icon"
  - "account alert symbol"
  - "account alert animation"
  - "account alert visual cue"
  - "show account alert"
  - "animated account alert"
  - "账户警告"
  - "账户警告图标"
  - "账户警告动画"
  - "账户警告提示"
best_for:
  - "A spoken reference to account alert needs a compact, immediately recognizable cue"
  - "The spoken point identifies a real risk, failure, hazard, or urgent exception"
avoid_when:
  - "The spoken meaning does not refer to account alert or a close synonym"
  - "The message is neutral, routine, positive, or too speculative to justify alarm"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
