spec_version: 1
id: line-md-check-list-3
name: "Check List 3"
description: "A compact check list 3 icon uses draw-in motion to illustrate completion, approval, confirmation, or a verified successful result."
surfaces: [video]
category: sticker-success
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-success
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["check", "list", "3", "draw-in", "success", "confirmation", "positive", "compact"]
intent_keywords:
  - "check list 3"
  - "check list 3 icon"
  - "check list 3 symbol"
  - "check list 3 animation"
  - "check list 3 visual cue"
  - "show check list 3"
  - "animated check list 3"
  - "勾选"
  - "勾选图标"
  - "勾选动画"
  - "勾选提示"
best_for:
  - "A spoken reference to check list 3 needs a compact, immediately recognizable cue"
  - "A task, verification, transaction, or decision has clearly succeeded"
avoid_when:
  - "The spoken meaning does not refer to check list 3 or a close synonym"
  - "The outcome is still pending, uncertain, failed, or merely being discussed"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
