spec_version: 1
id: line-md-arrow-small-up
name: "Arrow Small Up"
description: "A compact arrow small up icon uses draw-in motion to illustrate direction, location, movement, or progression through steps."
surfaces: [video]
category: sticker-navigation
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-navigation
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["arrow", "small", "up", "draw-in", "navigation", "direction", "movement", "compact"]
intent_keywords:
  - "arrow small up"
  - "arrow small up icon"
  - "arrow small up symbol"
  - "next"
  - "previous"
  - "back"
  - "location"
  - "left"
  - "scroll"
  - "direction"
  - "箭头"
  - "下一步"
  - "返回"
  - "向左"
  - "向下滚动"
  - "位置"
best_for:
  - "A spoken reference to arrow small up needs a compact, immediately recognizable cue"
  - "The narration points to a direction, destination, location, or next step"
avoid_when:
  - "The spoken meaning does not refer to arrow small up or a close synonym"
  - "No spatial or sequential relationship needs to be communicated"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
