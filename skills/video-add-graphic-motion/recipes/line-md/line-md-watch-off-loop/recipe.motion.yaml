spec_version: 1
id: line-md-watch-off-loop
name: "Watch Off (Loop)"
description: "A compact watch off icon uses draw-in, morph, looping motion to illustrate time, dates, schedules, appointments, or deadlines."
surfaces: [video]
category: sticker-time
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-time
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["watch", "off", "draw-in", "morph", "looping", "time", "schedule", "deadline", "loop"]
intent_keywords:
  - "watch off"
  - "watch off icon"
  - "watch off symbol"
  - "schedule"
  - "date"
  - "calendar"
  - "time"
  - "deadline"
  - "appointment"
  - "running time"
  - "手表"
  - "安排日期"
  - "日历"
  - "时间"
  - "截止时间"
  - "预约"
best_for:
  - "A spoken reference to watch off needs a compact, immediately recognizable cue"
  - "A date, deadline, appointment, duration, or schedule is central to the cue"
avoid_when:
  - "The spoken meaning does not refer to watch off or a close synonym"
  - "Timing is incidental and no date, duration, or deadline needs emphasis"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
