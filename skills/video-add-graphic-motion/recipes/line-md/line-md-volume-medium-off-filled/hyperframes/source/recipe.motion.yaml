  - "sound"
  - "mute"
  - "audio"
  - "video playback"
  - "music"
  - "volume"
  - "media control"
  - "音量"
  - "声音"
  - "音频"
  - "视频播放"
  - "音乐"
  - "播放控制"
best_for:
  - "A spoken reference to volume medium off needs a compact, immediately recognizable cue"
  - "The narration directly discusses sound, music, video, volume, or playback"
avoid_when:
  - "The spoken meaning does not refer to volume medium off or a close synonym"
  - "Media controls are visible in the footage but not relevant to the spoken meaning"
