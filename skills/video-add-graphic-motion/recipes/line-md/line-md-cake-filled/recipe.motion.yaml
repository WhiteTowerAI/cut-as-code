spec_version: 1
id: line-md-cake-filled
name: "Cake Reveal (Filled)"
description: "A compact cake icon uses draw-in, morph, fade motion to illustrate a win, launch, milestone, or earned celebratory reveal."
surfaces: [video]
category: sticker-celebration
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-celebration
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["cake", "draw-in", "morph", "fade", "celebration", "festive", "positive", "compact", "filled"]
intent_keywords:
  - "cake"
  - "cake icon"
  - "cake symbol"
  - "celebration"
  - "celebrate"
  - "achievement"
  - "milestone"
  - "launch"
  - "won"
  - "festive reveal"
  - "庆祝"
  - "赢了"
  - "喜庆揭晓"
  - "成就"
  - "里程碑"
  - "发布"
best_for:
  - "A spoken reference to cake needs a compact, immediately recognizable cue"
  - "A genuine positive achievement or announcement deserves a festive visual payoff"
avoid_when:
  - "The spoken meaning does not refer to cake or a close synonym"
  - "The event is neutral, negative, sensitive, or not genuinely celebratory"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
