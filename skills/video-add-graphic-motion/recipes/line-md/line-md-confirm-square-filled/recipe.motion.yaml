spec_version: 1
id: line-md-confirm-square-filled
name: "Confirm Square (Filled)"
description: "A compact confirm square icon uses draw-in motion to illustrate completion, approval, confirmation, or a verified successful result."
surfaces: [video]
category: sticker-success
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-success
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["confirm", "square", "draw-in", "success", "confirmation", "positive", "compact", "filled"]
intent_keywords:
  - "confirm square"
  - "confirm square icon"
  - "confirm square symbol"
  - "completed"
  - "successful"
  - "approved"
  - "confirmed"
  - "done"
  - "passed"
  - "check mark"
  - "确认"
  - "完成"
  - "成功"
  - "通过"
  - "搞定"
  - "无误"
best_for:
  - "A spoken reference to confirm square needs a compact, immediately recognizable cue"
  - "A task, verification, transaction, or decision has clearly succeeded"
avoid_when:
  - "The spoken meaning does not refer to confirm square or a close synonym"
  - "The outcome is still pending, uncertain, failed, or merely being discussed"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
