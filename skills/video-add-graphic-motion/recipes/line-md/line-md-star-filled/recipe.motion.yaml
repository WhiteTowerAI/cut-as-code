spec_version: 1
id: line-md-star-filled
name: "Star Reveal (Filled)"
description: "A compact star icon uses draw-in motion to illustrate affection, appreciation, a favorite, or a positive audience reaction."
surfaces: [video]
category: sticker-reaction
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-reaction
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["star", "draw-in", "reaction", "affection", "positive", "compact", "filled"]
intent_keywords:
  - "star"
  - "star icon"
  - "star symbol"
  - "love"
  - "appreciation"
  - "favorite"
  - "thank you"
  - "audience reaction"
  - "rating"
  - "star animation"
  - "星星"
  - "喜欢"
  - "感谢"
  - "爱心回应"
  - "收藏"
  - "五星好评"
best_for:
  - "A spoken reference to star needs a compact, immediately recognizable cue"
  - "The narration expresses affection, appreciation, approval, or a favorite"
avoid_when:
  - "The spoken meaning does not refer to star or a close synonym"
  - "The cue is a formal completion status rather than an emotional reaction"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
