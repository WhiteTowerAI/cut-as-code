spec_version: 1
id: line-md-document-add-twotone
name: "Document Add (Twotone)"
description: "A compact document add icon uses draw-in motion to illustrate a concrete viewer action, command, or media control."
surfaces: [video]
category: sticker-action
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-action
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["document", "add", "draw-in", "action", "control", "instruction", "compact", "twotone"]
intent_keywords:
  - "document add"
  - "document add icon"
  - "document add symbol"
  - "document add animation"
  - "document add visual cue"
  - "show document add"
  - "animated document add"
  - "文档"
  - "文档图标"
  - "文档动画"
  - "文档提示"
best_for:
  - "A spoken reference to document add needs a compact, immediately recognizable cue"
  - "The speaker gives a clear instruction or names a specific control action"
avoid_when:
  - "The spoken meaning does not refer to document add or a close synonym"
  - "The verb is metaphorical or the audience is not expected to perform the action"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
