spec_version: 1
id: line-md-light-dark
name: "Light Dark"
description: "A compact light dark icon uses draw-in, morph, rotation, fade, looping motion to illustrate a literal physical object, place, food, vehicle, or everyday item."
surfaces: [video]
category: sticker-object
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-object
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["light", "dark", "draw-in", "morph", "rotation", "fade", "looping", "object"]
intent_keywords:
  - "light dark"
  - "light dark icon"
  - "light dark symbol"
  - "light dark animation"
  - "light dark visual cue"
  - "show light dark"
  - "animated light dark"
  - "日常物品"
  - "日常物品图标"
  - "日常物品动画"
  - "日常物品提示"
best_for:
  - "A spoken reference to light dark needs a compact, immediately recognizable cue"
  - "The named object itself is visually useful and immediately recognizable in context"
avoid_when:
  - "The spoken meaning does not refer to light dark or a close synonym"
  - "The object name is metaphorical or a more specific semantic category communicates the point better"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
