spec_version: 1
id: mojs-corner-sparks
name: "Corner Sparks"
description: "Corner Sparks built from mo.js Burst and Shape primitives."
surfaces: [video]
category: sticker-impact
tech: [js]
canvas: [video]
target: [overlay]
intent: sticker-impact
runtime: ["js"]
export: [skill, html]
dependencies: []
tags: ["sticker", "mojs", "burst", "line"]
intent_keywords:
  - "sticker"
  - "mojs"
  - "burst"
  - "line"
best_for:
  - "Impact beats, confirmations, emphasis hits, and compact celebration cues"
avoid_when:
  - "The cue needs literal information rather than an abstract impact"
  - "Any ring or particle path would cross a visible face"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: js
    files: ["vendor.js", "effect.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/mojs/mojs/blob/0a9cf9a87dd5637e6fa770755e79048489bcf817/dist/mo.umd.js"
  attribution_required: true
author:
  name: "Oleg Solomka and mo.js contributors"
  url: "https://github.com/mojs/mojs"
version: 1.7.1
