category: sticker-emphasis
tech: [js]
canvas: [video]
target: [overlay]
intent: sticker-emphasis
runtime: ["js"]
export: [skill, html]
dependencies: []
tags: ["rings", "shockwave", "expanding", "impact", "emphasis", "abstract", "reveal", "compact"]
intent_keywords:
  - "shockwave"
  - "impact rings"
  - "impact beat"
  - "attention pulse"
  - "energy burst"
  - "ripple emphasis"
  - "abstract energy"
  - "dramatic impact"
  - "shockwave icon"
  - "shockwave animation"
  - "冲击波"
  - "冲击圆环"
  - "强调"
  - "强烈冲击"
  - "脉冲强调"
  - "能量爆发"
best_for:
  - "A spoken reference to shockwave needs a compact, immediately recognizable cue"
  - "The edit needs a compact abstract hit without introducing a literal icon or new information"
avoid_when:
  - "The spoken meaning does not refer to shockwave or a close synonym"
  - "A literal status, object, or action would communicate the spoken meaning more precisely"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
