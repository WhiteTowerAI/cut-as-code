spec_version: 1
id: tsparticles-fireworks
name: "Complex Fireworks"
description: "Complex Fireworks as a deterministic canvas port of the official tsParticles fireworks preset."
surfaces: [video]
category: sticker-complex-particles
tech: [js]
canvas: [video]
target: [overlay]
intent: sticker-complex-particles
runtime: ["js"]
export: [skill, html]
dependencies: []
tags: ["sticker", "tsparticles", "particles", "fireworks"]
intent_keywords:
  - "sticker"
  - "tsparticles"
  - "particles"
  - "fireworks"
best_for:
  - "Complex particle fields whose behavior is not covered by the smaller confetti or burst recipes"
avoid_when:
  - "A simpler canvas-confetti or mo.js recipe communicates the same cue"
  - "The particle field would obscure faces or required footage detail"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: js
    files: ["effect.js", "upstream-options.ts"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/tsparticles/tsparticles/blob/d38e87725cb0fa7108481b39064e067203068bac/presets/fireworks/src/options.ts"
  attribution_required: true
author:
  name: "Matteo Bruni"
  url: "https://github.com/tsparticles/tsparticles"
version: 4.3.2
