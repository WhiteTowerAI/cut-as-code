spec_version: 1
id: tsparticles-fireworks
name: "Multi-Burst Fireworks"
description: "Multiple colorful fireworks launching and bursting across a wide field."
surfaces: [video]
category: sticker-celebration
tech: [js]
canvas: [video]
target: [overlay]
intent: sticker-celebration
runtime: ["js"]
export: [skill, html]
dependencies: []
tags: ["fireworks", "multi-burst", "full-frame", "high-impact", "celebration", "festive", "positive", "reveal"]
intent_keywords:
  - "fireworks"
  - "festival celebration"
  - "celebration"
  - "celebrate"
  - "achievement"
  - "milestone"
  - "launch"
  - "won"
  - "festive reveal"
  - "fireworks icon"
  - "烟花"
  - "节日庆祝"
  - "庆祝"
  - "赢了"
  - "喜庆揭晓"
  - "成就"
best_for:
  - "A spoken reference to fireworks needs a compact, immediately recognizable cue"
  - "A genuine positive achievement or announcement deserves a festive visual payoff"
avoid_when:
  - "The spoken meaning does not refer to fireworks or a close synonym"
  - "The event is neutral, negative, sensitive, or not genuinely celebratory"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: js
    files: ["effect.js", "upstream-options.ts"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/tsparticles/tsparticles/blob/d38e87725cb0fa7108481b39064e067203068bac/presets/fireworks/src/options.ts"
  attribution_required: true
author:
