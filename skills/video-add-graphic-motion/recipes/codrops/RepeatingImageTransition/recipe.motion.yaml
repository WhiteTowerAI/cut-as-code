spec_version: 1
id: "codrops-repeatingimagetransition-index"
name: "Animating in Frames: Repeating Image Transition"
description: "Repeated image echoes create an editorial before-and-after visual transition."
surfaces: [video]
category: "fullscreen-transition"
tech: [html, css, js]
canvas: [video]
target: [fullscreen]
intent: "fullscreen-transition"
runtime: [css, js]
export: [skill, html]
dependencies: []
tags:
  - "codrops"
  - "repeating-images"
  - "echo"
  - "fashion"
  - "transition"
  - "chapter"
  - "fullscreen"
intent_keywords:
  - "repeating image transition"
  - "fashion photo echo"
  - "editorial montage break"
  - "重复图片转场"
  - "时尚图片回响"
best_for:
  - "A chapter or interstitial in fashion, music, beauty, and photography-led edits"
  - "A fullscreen transition that repeats one compatible object or non-face portrait image"
avoid_when:
  - "The visual subject must stay literal, stable, and unduplicated"
  - "The repeated crops would create confusion around protected faces or evidence imagery"
structural_roles:
  - "chapter"
  - "interstitial"
motion_functions:
  - "transition"
  - "build"
  - "settle"
visual_language:
  - "editorial"
  - "fashion"
  - "experimental"
mechanisms:
  - "image-repeat"
  - "echoes"
  - "scale"
rhythm_energy: "medium-high"
information_density: "balanced"
frame_relationship: "fullscreen"
color_tendency: "image-led"
style_rationale: "The reviewed red portrait state makes duplication and echoing of a central image the transition mechanism, demanding full-frame attention."
restraint:
  max_per_view: 1
  notes: "Use as one frame-dominant designed cutaway; adapt content, palette, typography, framing, and timing instead of running an unchanged source showcase."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: "index/index.html"
implementations:
  - tech: js
    files: ["index/index.html", "index/hf-recipe.js", "index/hf-adapter.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt imagery, palette, typography, framing, and timing to the shot."
