  upstream: "https://tympanus.net/Tutorials/KineticImages"
  attribution_required: true
author:
  name: Dominik Fojcik / Codrops
  url: "https://github.com/DGFX/codrops-kinetic-images"
source_revision: 965dda362a8f9e5d522ed675493897200d273e49
