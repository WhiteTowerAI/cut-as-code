spec_version: 1
id: kinetic-images
name: Kinetic Images
description: Three image treatments mapped onto stacked cylinders, folded paper, and a spiral mesh.
surfaces: [web, video, interaction]
category: image-treatment
tech: [three, webgl]

canvas: [web, video]
target: [image, background, cutaway]
intent: kinetic-image
runtime: [three]
export: [skill, html]

dependencies: ["three@0.175.0"]
tags: [three-js, webgl, image, cylinder, paper, spiral, kinetic]
intent_keywords:
  - kinetic image collage
  - scrolling image ribbon
  - dimensional photo treatment
best_for:
  - Turning a small image set into a dimensional visual cutaway
  - Editorial transitions that need a recognizable 3D image surface
  - Selecting one of the cylinders, paper, or spiral scene modes
avoid_when:
  - Faces cannot be kept outside the complete animated image surface
  - The footage already contains dense or fast camera motion
  - A lightweight DOM-only overlay is required
restraint:
  max_per_view: 1
  notes: Use one scene mode per adapted cue; the showcase mode exists only to review the bundled recipe.

motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: static
  gpu_safe: true

entry: preview.html
implementations:
  - tech: three
    files: [scene.js, scene-time.js, preview.js, upstream/public/paper.glb, upstream/public/spiral.glb]
    usage: Set data-scene-mode to cylinders, paper, or spiral, then drive renderAt with absolute seconds.

license:
