<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>video-to-hyperframes — almanac composition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- almanac font: Newsreader serif. Google Fonts <link>, weights enumerated
         (only what the CSS uses: 400/500/600). Swap the family + weights to
         re-theme. A proprietary face needs a self-hosted @font-face instead. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── almanac theme ─────────────────────────────────────────────────────
         Warm cream/serif publishing look. Change these 5 vars + the fonts <link>
         to re-color/re-font the whole piece. Sizes are vh so the design reads at
         any output resolution — never hardcode px for type/spacing.
         Background is transparent: the render is an OVERLAY, composited onto the
         footage by ffmpeg. fullBleed scenes (.bleed) paint opaque cream so a
         cream gradient isn't invisible over bright footage. */
      :root {
        --ink: #14120e; /* near-black serif ink */
        --muted: #5c574e; /* warm grey, secondary text */
        --coral: #c15f3c; /* terracotta accent */
        --cream: #f9f7f3; /* fullBleed + card fill */
        --serif: "Newsreader", Georgia, "Times New Roman", serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1920px; /* set to your source W/H (data-width/height below too) */
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: var(--serif);
      }
      /* No opacity:0 here — the HF runtime windows each .clip by its
         data-start/data-duration via style.visibility. Pinning opacity:0 would
         leave a scene visible-but-transparent during its window (blank canvas).
         Inner wrappers do the fade; the runtime does show/hide. */
      .scene {
        position: absolute;
        inset: 0;
      }
      /* full-bleed cream takeover (a fullBleed scene) */
      .bleed {
        background: var(--cream);
      }
      /* Anchor wrappers. flex-direction:column is load-bearing: a plain flex div
         defaults to row and maps justify/align to the wrong axes, landing cards
         top-right instead of bottom-left. Flip to top by swapping justify-content
         to flex-start (and move a bottom scene's padding to the top). */
      .anchor-bl {
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* bottom — the lower-third safe zone */
        align-items: flex-start; /* left */
      }
      .anchor-center {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* ── Intro (fullBleed): kicker → title → sub, left accent bar ─────────── */
      .intro-wrap {
        display: flex;
        gap: 2.4vh;
        padding: 0 0 9vh 6vh;
      }
      .accent-bar {
        width: 0.8vh;
        background: var(--coral);
        border-radius: 0.4vh;
      }
      .kicker {
        color: var(--coral);
        font-size: 2.6vh;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .title {
        color: var(--ink);
        font-weight: 600;
        line-height: 0.98;
        letter-spacing: -1.5px;
      }
      .intro .title {
        font-size: 10vh;
        margin-top: 1vh;
      }
      .sub {
        color: var(--muted);
        font-size: 3.4vh;
        font-weight: 400;
        margin-top: 1.4vh;
      }

      /* ── SectionCard (fullBleed): kicker + title + coral rule bar ─────────── */
      .section-wrap {
        padding: 0 0 9vh 6vh;
      }
      .section .title {
        font-size: 8.5vh;
        letter-spacing: -1px;
        line-height: 1;
      }
      .rule-bar {
        height: 0.6vh;
        width: 36vh;
        background: var(--coral);
        border-radius: 0.3vh;
        margin-top: 2vh;
        transform-origin: left center;
      }

      /* ── LowerThird: solid cream card, coral left border, line1 + line2 ───── */
      .lt-wrap {
        padding: 0 0 8vh 5vh;
      }
      .card {
        background: var(--cream);
        border-left: 0.9vh solid var(--coral);
        border-radius: 1vh;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      }
      .lt .line1 {
        color: var(--ink);
        font-size: 6vh;
        font-weight: 600;
        letter-spacing: -0.5px;
        line-height: 1.05;
      }
      .lt .line2 {
        color: var(--muted);
        font-size: 3.6vh;
        font-weight: 400;
        margin-top: 0.8vh;
      }
      .lt .card {
        padding: 2.2vh 3vh;
      }

      /* ── StatCallout: solid cream card, coral bottom border, count-up + label */
      .stat-wrap {
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* bottom */
        align-items: flex-end; /* right */
        padding: 0 5vh 8vh 0;
      }
      .stat .card {
        border-left: none;
        border-bottom: 0.6vh solid var(--coral);
        display: flex;
        align-items: baseline;
        gap: 1.6vh;
        padding: 1.8vh 3vh;
      }
      .stat .value {
        color: var(--coral);
        font-size: 9vh;
        font-weight: 600;
        letter-spacing: -1px;
        line-height: 1;
      }
      .stat .label {
        color: var(--ink);
        font-size: 3.4vh;
        font-weight: 500;
      }

      /* ── Outro (fullBleed): centered coral diamond + wordmark lockup ──────── */
      .outro-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .diamond {
        width: 2.6vh;
        height: 2.6vh;
        background: var(--coral);
        border-radius: 0.3vh;
        transform: rotate(45deg);
        margin-bottom: 3vh;
      }
      .outro .title {
        font-size: 8.5vh;
        letter-spacing: -1px;
      }
      .outro .sub {
        color: var(--ink);
        margin-top: 1.4vh;
      }
      .outro .small {
        color: var(--muted);
        font-size: 2.8vh;
        font-weight: 400;
        margin-top: 0.8vh;
      }
    </style>
  </head>
  <body>
    <!-- Worked example: the 5 core cues packed back-to-back at 6s each (30s) so
         every card is eyeballable in one render. In production, keep each cue's
         transcript-derived at/dur (from work/cues.json) and set the stage
         data-duration to the SOURCE length; scenes fire on the spoken word.
         Set data-width/height/fps to the source (scripts/probe.py of
         video-to-remotion writes source-meta.json you can read). -->
    <div
      id="stage"
      data-composition-id="v2hf-almanac"
      data-start="0"
      data-duration="30"
      data-fps="24"
      data-width="1920"
      data-height="1080"
    >
      <!-- cue 1: Intro (0–6s) — fullBleed -->
      <div id="intro" class="scene bleed anchor-bl clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="intro">
          <div class="intro-wrap">
            <div class="accent-bar"></div>
            <div>
              <div class="kicker">MONDAY MORNING MEETING · EP 14</div>
              <div class="title">HS TOP 200</div>
              <div class="sub">with Herschel Fruean — NZ Schoolboy Rugby</div>
            </div>
          </div>
        </div>
      </div>

      <!-- cue 2: SectionCard (6–12s) — fullBleed -->
      <div id="section" class="scene bleed anchor-bl clip" data-start="6" data-duration="6" data-track-index="0">
        <div class="section">
          <div class="section-wrap">
            <div class="kicker">PART 1</div>
            <div class="title" style="margin-top: 1.2vh">The Christchurch Trip</div>
            <div class="rule-bar"></div>
          </div>
        </div>
      </div>

      <!-- cue 3: LowerThird (12–18s) — solid card over footage -->
      <div id="lt" class="scene anchor-bl clip" data-start="12" data-duration="6" data-track-index="1">
        <div class="lt">
          <div class="lt-wrap">
            <div class="card">
              <div class="line1">St Bede's vs Christ's</div>
              <div class="line2">His two best teams down south</div>
            </div>
          </div>
        </div>
      </div>

      <!-- cue 4: StatCallout (18–24s) — count-up; data-stat-value drives it -->
      <div id="stat" class="scene stat-wrap clip" data-start="18" data-duration="6" data-track-index="1">
        <div class="stat">
          <div class="card">
            <div class="value" data-stat-value="62">0</div>
            <div class="label">points — a blowout</div>
          </div>
        </div>
      </div>

      <!-- cue 5: Outro (24–30s) — fullBleed -->
      <div id="outro" class="scene bleed anchor-center clip" data-start="24" data-duration="6" data-track-index="0">
        <div class="outro">
          <div class="outro-wrap">
            <div class="diamond"></div>
            <div class="title">HS TOP 200</div>
            <div class="sub">Thanks for watching</div>
            <div class="small">Monday Morning Meeting Podcast</div>
          </div>
        </div>
      </div>

      <script>
        // ────────────────────────────────────────────────────────────────────
        // One paused GSAP timeline, keyed in SECONDS (HF seeks it per frame).
        // Timing mirrors the almanac design language (was anim.tsx @24fps):
        //   fade 0.292s · reveal 0.542s · stagger beat 0.167s · rule-draw 0.417s
        // EASE_OUT bezier(0.16,1,0.3,1) ≈ power4.out. stagger entrance = title
        // clip-wipe + kicker/sub fade-rise; each scene's inner wrapper fades.
        //
        // Two seek-safety rules the HF linter enforces (learned the hard way):
        //   1. Fade an INNER wrapper, never the .clip div — the runtime owns clip
        //      visibility; animating it leaves stale state on non-linear seeks.
        //   2. Animate a transform with fromTo (not to) when CSS sets its initial
        //      value, so GSAP owns the whole transform (no scaleX/rotate clobber).
        // ────────────────────────────────────────────────────────────────────
        const EO = "power4.out";
        const FADE = 0.292,
          REVEAL = 0.542,
          STAG = 0.167,
          IN = 0.417;

        const tl = gsap.timeline({ paused: true });

        // Fade a scene's inner wrapper in at `start`, out over its last FADE s.
        function sceneFade(sel, start, dur) {
          const el = document.querySelector(sel);
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: FADE, ease: "none" }, start);
          tl.to(el, { opacity: 0, duration: FADE, ease: "none" }, start + dur - FADE);
          tl.set(el, { opacity: 0 }, start + dur); // hard kill (seek-safe)
        }
        // title entrance: clip-path wipe L→R + fade, over REVEAL after `at`.
        function titleIn(el, at) {
          tl.fromTo(
            el,
            { opacity: 0, clipPath: "inset(0 100% 0 0)" },
            { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: REVEAL, ease: EO },
            at,
          );
        }
        // kicker/sub entrance: fade + translateY(1.2vh→0), over REVEAL after `at`.
        function riseIn(el, at) {
          tl.fromTo(el, { opacity: 0, y: "1.2vh" }, { opacity: 1, y: 0, duration: REVEAL, ease: EO }, at);
        }

        // ─── cue 1: Intro (kicker@0, title@1, sub@3 beats) ───────────────────
        sceneFade("#intro .intro", 0, 6);
        const intro = document.querySelector("#intro");
        riseIn(intro.querySelector(".kicker"), 0 + 0 * STAG);
        titleIn(intro.querySelector(".title"), 0 + 1 * STAG);
        riseIn(intro.querySelector(".sub"), 0 + 3 * STAG);

        // ─── cue 2: SectionCard (kicker@0, title@1, rule drawn@2 beats) ──────
        sceneFade("#section .section", 6, 6);
        const section = document.querySelector("#section");
        riseIn(section.querySelector(".kicker"), 6 + 0 * STAG);
        titleIn(section.querySelector(".title"), 6 + 1 * STAG);
        tl.fromTo(section.querySelector(".rule-bar"), { scaleX: 0 }, { scaleX: 1, duration: IN, ease: EO }, 6 + 2 * STAG);

        // ─── cue 3: LowerThird (line1 clip-wipe, line2 rise) ─────────────────
        sceneFade("#lt .lt", 12, 6);
        const lt = document.querySelector("#lt");
        titleIn(lt.querySelector(".line1"), 12);
        riseIn(lt.querySelector(".line2"), 12 + 3 * STAG);

        // ─── cue 4: StatCallout (value counts 0→N over REVEAL) ───────────────
        // Count-up = tween a counter object, write textContent on update.
        // power3.out ≈ Remotion's easeOutCubic; onUpdate fires per seeked frame.
        sceneFade("#stat .stat", 18, 6);
        const stat = document.querySelector("#stat");
        const valueEl = stat.querySelector(".value");
        const counter = { v: 0 };
        tl.to(
          counter,
          {
            v: Number(valueEl.dataset.statValue),
            duration: REVEAL,
            ease: "power3.out",
            onUpdate: () => {
              valueEl.textContent = Math.round(counter.v).toLocaleString();
            },
          },
          18,
        );
        riseIn(stat.querySelector(".label"), 18 + 3 * STAG);

        // ─── cue 5: Outro (diamond rise, title wipe, sub/small rise) ─────────
        sceneFade("#outro .outro", 24, 6);
        const outro = document.querySelector("#outro");
        riseIn(outro.querySelector(".diamond"), 24 + 0 * STAG);
        titleIn(outro.querySelector(".title"), 24 + 1 * STAG);
        riseIn(outro.querySelector(".sub"), 24 + 3 * STAG);
        riseIn(outro.querySelector(".small"), 24 + 3 * STAG);

        // Register the timeline — key MUST equal the stage's data-composition-id.
        window.__timelines = window.__timelines || {};
        window.__timelines["v2hf-almanac"] = tl;
      </script>
    </div>
  </body>
</html>
