<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content cards review</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #151719;
      --band: #1d2023;
      --surface: #24282b;
      --line: #3b4145;
      --text: #f2eee5;
      --muted: #aeb4b7;
      --accent: #4fc3b4;
      --warning: #f3bd5b;
      --proxy: rgba(86, 91, 94, 0.88);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, sans-serif;
      letter-spacing: 0;
    }
    header { border-bottom: 1px solid var(--line); background: var(--band); }
    .header-inner, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .header-inner { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding: 20px 0; }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .summary { display: flex; gap: 18px; color: var(--muted); white-space: nowrap; }
    .summary strong { color: var(--text); }
    main { padding: 20px 0 40px; }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 8px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    #selection-count { color: var(--warning); }
    #selection-count.on-target { color: var(--accent); }
    button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    button:hover, button:focus-visible { background: #253b38; outline: none; }
    form { display: grid; gap: 10px; padding-top: 14px; }
    .candidate {
      display: grid;
      grid-template-columns: 40px 140px minmax(210px, 1fr) 170px 130px minmax(280px, 360px);
      gap: 14px;
      align-items: center;
      min-height: 104px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }
    .pick { display: grid; place-items: center; align-self: stretch; cursor: pointer; }
    .pick input { width: 20px; height: 20px; accent-color: var(--accent); }
    .identity { display: grid; gap: 2px; min-width: 0; color: var(--muted); }
    .identity strong { color: var(--text); font-size: 15px; }
    .identity span { overflow-wrap: anywhere; }
    .field { display: grid; gap: 6px; min-width: 0; color: var(--muted); }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid #50575c;
      border-radius: 4px;
      background: #171a1c;
      color: var(--text);
      font: inherit;
      padding: 8px 10px;
    }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      outline: 2px solid #265950;
    }
    textarea { resize: vertical; }
    .frame-preview {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid #50575c;
      border-radius: 4px;
      background: #090a0b;
      aspect-ratio: 16 / 9;
    }
    .frame-preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #090a0b;
    }
    .placement-proxy {
      position: absolute;
      display: grid;
      place-items: center;
      padding: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 3px;
      background: var(--proxy);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 650;
      line-height: 1.15;
      text-align: center;
      opacity: 0;
      pointer-events: none;
    }
    .placement-proxy[data-placement="top"] {
      top: 6%; left: 22%; width: 56%; height: 22%; opacity: 1;
    }
    .placement-proxy[data-placement="bottom"] {
      bottom: 6%; left: 22%; width: 56%; height: 22%; opacity: 1;
    }
    .placement-proxy[data-placement="left"] {
      top: 22%; left: 4%; width: 34%; height: 56%; opacity: 1;
    }
    .placement-proxy[data-placement="right"] {
      top: 22%; right: 4%; width: 34%; height: 56%; opacity: 1;
    }
    .placement-proxy[data-placement="center"] {
      top: 35%; left: 21%; width: 58%; height: 30%; opacity: 1;
    }
    .placement-proxy[data-chart="true"][data-placement="top"] {
      top: 4%; left: 15%; width: 70%; height: 34%;
    }
    .placement-proxy[data-chart="true"][data-placement="bottom"] {
      bottom: 4%; left: 15%; width: 70%; height: 34%;
    }
    .placement-proxy[data-chart="true"][data-placement="left"] {
      top: 15%; left: 3%; width: 42%; height: 70%;
    }
    .placement-proxy[data-chart="true"][data-placement="right"] {
      top: 15%; right: 3%; width: 42%; height: 70%;
    }
    .placement-proxy[data-chart="true"][data-placement="center"] {
      top: 22%; left: 15%; width: 70%; height: 56%;
    }
    .placement-proxy span {
      display: -webkit-box;
      overflow: hidden;
      overflow-wrap: anywhere;
      white-space: pre-line;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    [data-caption-occupancy] { position: absolute; inset: 0; pointer-events: none; }
    .caption-occupancy {
      position: absolute;
      z-index: 1;
      border: 1px dashed rgba(243, 189, 91, 0.95);
      background: rgba(243, 189, 91, 0.2);
    }
    .caption-occupancy[data-region="top"] { top: 6%; left: 16%; width: 68%; height: 24%; }
    .caption-occupancy[data-region="center"] { top: 35%; left: 12%; width: 76%; height: 30%; }
    .caption-occupancy[data-region="bottom"] { bottom: 6%; left: 12%; width: 76%; height: 24%; }
    .chart-editor {
      grid-column: 2 / -1;
      min-width: 0;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .chart-editor[hidden] { display: none; }
    .chart-editor summary { color: var(--text); font-weight: 650; cursor: pointer; }
    .chart-fields { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
    .chart-points { display: grid; gap: 8px; margin-top: 10px; }
    .chart-point {
      display: grid;
      grid-template-columns: minmax(110px, 1fr) minmax(90px, 0.7fr) minmax(180px, 1.6fr) 36px;
      gap: 8px;
      align-items: end;
    }
    .point-evidence { font: 12px/1.35 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .remove-point { width: 36px; min-height: 40px; padding: 0; font-size: 20px; }
    .chart-actions { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
    .chart-error { color: var(--warning); overflow-wrap: anywhere; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    .summary-box {
      margin-top: 20px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      padding: 14px;
    }
    .summary-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .summary-box-header h2 { margin: 0; font-size: 16px; }
    #copy-summary { position: relative; }
    #copy-summary.copied { border-color: var(--accent); background: #253b38; }
    #summary-output {
      width: 100%;
      min-height: 120px;
      margin: 0;
      padding: 10px;
      border: 1px solid #50575c;
      border-radius: 4px;
      background: #171a1c;
      color: var(--text);
      font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    @media (max-width: 1100px) {
      .candidate { grid-template-columns: 40px 140px minmax(210px, 1fr) 170px 130px; }
      .frame-preview { grid-column: 2 / -1; width: min(520px, 100%); }
    }
    @media (max-width: 780px) {
      .header-inner, .toolbar { align-items: stretch; flex-direction: column; gap: 10px; }
      .toolbar { position: static; }
      .toolbar button { width: 100%; }
      .summary { display: grid; gap: 2px; white-space: normal; }
      .candidate { grid-template-columns: 36px 1fr; align-items: start; }
      .copy-field, .treatment-field, .placement-field { grid-column: 2; }
      .frame-preview { grid-column: 1 / -1; }
      .chart-editor { grid-column: 1 / -1; }
      .chart-fields { grid-template-columns: 1fr 1fr; }
      .chart-point { grid-template-columns: 1fr 1fr 36px; }
      .chart-point .evidence-field { grid-column: 1 / 3; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Content cards review</h1>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <strong id="selection-count" aria-live="polite"></strong>
    </div>
    <form id="review-form"></form>
    <section class="summary-box">
      <div class="summary-box-header">
        <h2>Copy the following summary back to the AI agent.</h2>
        <button id="copy-summary" type="button">Copy summary</button>
      </div>
      <pre id="summary-output">No cards selected yet.</pre>
    </section>
  </main>

  <template id="candidate-template">
    <article class="candidate">
      <label class="pick">
        <input type="checkbox" name="selected">
      </label>
      <div class="identity">
        <strong data-id></strong>
        <span data-type></span>
        <span data-time></span>
      </div>
      <label class="field copy-field">
        <span>Text</span>
        <input type="text" name="copy">
      </label>
      <label class="field treatment-field">
        <span>Visual treatment</span>
        <select name="visual_treatment">
          <option value="default">Default</option>
          <option value="metric-spotlight">Metric spotlight</option>
          <option value="bar-chart">Bar chart</option>
          <option value="pie-chart">Pie chart</option>
          <option value="line-chart">Line chart</option>
          <option value="side-by-side">Side by side</option>
          <option value="parallel-columns">Parallel columns</option>
        </select>
      </label>
      <label class="field placement-field">
        <span>Placement</span>
        <select name="placement">
          <option value="">Unplaced</option>
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
          <option value="center">Center</option>
        </select>
      </label>
      <div class="frame-preview">
        <img alt="">
        <div data-caption-occupancy></div>
        <div class="placement-proxy" data-placement="">
          <span data-proxy-copy></span>
        </div>
      </div>
      <details class="chart-editor" data-chart-editor hidden>
        <summary>Chart data</summary>
        <div class="chart-fields">
          <label class="field"><span>Dimension</span><input type="text" name="dimension_label"></label>
          <label class="field"><span>Metric</span><input type="text" name="metric_label"></label>
          <label class="field"><span>Unit</span><input type="text" name="unit"></label>
          <label class="field"><span>Period</span><input type="text" name="period"></label>
        </div>
        <div class="chart-points" data-chart-points></div>
        <div class="chart-actions">
          <button type="button" data-add-point>Add point</button>
          <span class="chart-error" data-chart-error aria-live="polite"></span>
        </div>
      </details>
    </article>
  </template>

  <template id="chart-point-template">
    <div class="chart-point">
      <label class="field"><span>Label</span><input type="text" name="point_label"></label>
      <label class="field"><span>Value</span><input type="number" step="any" name="point_value"></label>
      <label class="field evidence-field">
        <span>Evidence refs</span>
        <input class="point-evidence" type="text" name="point_evidence_refs">
      </label>
      <button class="remove-point" type="button" data-remove-point title="Remove point" aria-label="Remove point">&times;</button>
    </div>
  </template>

  <script>
    const REVIEW_DATA_B64 = "__CONTENT_CARDS_REVIEW_DATA__";
    const binary = atob(REVIEW_DATA_B64);
    const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
    const reviewData = JSON.parse(new TextDecoder().decode(bytes));
    const form = document.querySelector("#review-form");
    const candidateTemplate = document.querySelector("#candidate-template");
    const chartPointTemplate = document.querySelector("#chart-point-template");
    const count = document.querySelector("#selection-count");
    const summaryOutput = document.querySelector("#summary-output");
    const copyButton = document.querySelector("#copy-summary");
    const placements = new Set(["", "top", "bottom", "left", "right", "center"]);
    const treatmentsByType = {
      "intro": new Set(["default"]),
      "key-quote": new Set(["default"]),
      "stat": new Set(["default", "metric-spotlight", "bar-chart", "pie-chart", "line-chart"]),
      "list": new Set(["default", "side-by-side", "parallel-columns"]),
      "outro": new Set(["default"]),
    };
    const chartLayouts = new Set(["bar-chart", "pie-chart", "line-chart"]);
    const pointLimits = {
      "bar-chart": [2, 6],
      "pie-chart": [2, 6],
      "line-chart": [3, 8],
    };
    const target = reviewData.target;

    function displayId(id) {
      return id.replace(/^card-0+/, "card-");
    }

    function makeCandidate(card) {
      const fragment = candidateTemplate.content.cloneNode(true);
      const row = fragment.querySelector(".candidate");
      const selected = row.querySelector('[name="selected"]');
      const copy = row.querySelector('[name="copy"]');
      const treatment = row.querySelector('[name="visual_treatment"]');
      const placement = row.querySelector('[name="placement"]');
      const image = row.querySelector("img");
      const preview = row.querySelector(".placement-proxy");
      const proxyCopy = row.querySelector("[data-proxy-copy]");
      const captionOccupancy = row.querySelector("[data-caption-occupancy]");
      const chartEditor = row.querySelector("[data-chart-editor]");
      const chartPoints = row.querySelector("[data-chart-points]");
      const chartError = row.querySelector("[data-chart-error]");
      const addPoint = row.querySelector("[data-add-point]");
      const chartFields = {
        dimension_label: row.querySelector('[name="dimension_label"]'),
        metric_label: row.querySelector('[name="metric_label"]'),
        unit: row.querySelector('[name="unit"]'),
        period: row.querySelector('[name="period"]'),
      };

      row.dataset.cardId = card.id;
      row.querySelector("[data-id]").textContent = displayId(card.id);
      row.querySelector("[data-type]").textContent = card.card_type;
      row.querySelector("[data-time]").textContent = `${card.program_start_s.toFixed(3)}s ~ ${card.duration_s.toFixed(3)}s`;
      selected.checked = card.selected;
      selected.setAttribute("aria-label", `Select ${card.id}`);
      copy.value = card.copy;
      const allowedTreatments = treatmentsByType[card.card_type] || treatmentsByType["intro"];
      for (const option of treatment.options) {
        option.disabled = !allowedTreatments.has(option.value);
        option.hidden = option.disabled;
      }
      treatment.value = allowedTreatments.has(card.visual_treatment)
        ? card.visual_treatment : "default";
      placement.value = placements.has(card.placement) ? card.placement : "";
      image.src = card.screenshot;
      image.alt = `Video frame for ${card.id}`;
      row.chartData = card.data ? JSON.parse(JSON.stringify(card.data)) : null;

      const occupiedRegions = new Set((card.caption_occupancy || []).map((item) => item.region));
      for (const region of occupiedRegions) {
        const box = document.createElement("div");
        box.className = "caption-occupancy";
        box.dataset.region = region;
        box.title = `Caption occupancy: ${region}`;
        captionOccupancy.append(box);
      }

      function emptyPoint() {
        return { label: "", value: null, evidence_refs: [] };
      }

      function ensureChartData() {
        if (!row.chartData) {
          row.chartData = {
            status: "draft",
            dimension_label: "",
            metric_label: "",
            unit: "",
            period: "",
            points: [],
          };
        }
        const minimum = pointLimits[treatment.value][0];
        while (row.chartData.points.length < minimum) row.chartData.points.push(emptyPoint());
      }

      function syncChartFields() {
        for (const [name, input] of Object.entries(chartFields)) {
          input.value = row.chartData?.[name] || "";
        }
      }

      function renderPoints() {
        chartPoints.replaceChildren();
        if (!row.chartData) return;
        const [minimum, maximum] = pointLimits[treatment.value];
        row.chartData.points.forEach((item, index) => {
          const pointFragment = chartPointTemplate.content.cloneNode(true);
          const pointRow = pointFragment.querySelector(".chart-point");
          const labelInput = pointRow.querySelector('[name="point_label"]');
          const valueInput = pointRow.querySelector('[name="point_value"]');
          const evidenceInput = pointRow.querySelector('[name="point_evidence_refs"]');
          const remove = pointRow.querySelector("[data-remove-point]");
          labelInput.value = item.label || "";
          valueInput.value = Number.isFinite(item.value) ? item.value : "";
          evidenceInput.value = Array.isArray(item.evidence_refs) ? item.evidence_refs.join(", ") : "";
          labelInput.addEventListener("input", () => { item.label = labelInput.value; updateAll(); });
          valueInput.addEventListener("input", () => {
            item.value = valueInput.value === "" ? null : valueInput.valueAsNumber;
            updateAll();
          });
          evidenceInput.addEventListener("input", () => {
            item.evidence_refs = evidenceInput.value.split(",").map((value) => value.trim()).filter(Boolean);
            updateAll();
          });
          remove.disabled = row.chartData.points.length <= minimum;
          remove.addEventListener("click", () => {
            row.chartData.points.splice(index, 1);
            renderPoints();
            updateAll();
          });
          chartPoints.append(pointFragment);
        });
        addPoint.disabled = row.chartData.points.length >= maximum;
      }

      function compactChartData() {
        if (!row.chartData) return null;
        return {
          dimension_label: chartFields.dimension_label.value.trim(),
          metric_label: chartFields.metric_label.value.trim(),
          unit: chartFields.unit.value.trim(),
          period: chartFields.period.value.trim(),
          points: row.chartData.points.map((item) => ({
            label: String(item.label || "").trim(),
            value: item.value,
            evidence_refs: Array.isArray(item.evidence_refs) ? [...item.evidence_refs] : [],
          })),
        };
      }

      function chartValidationError() {
        if (!chartLayouts.has(treatment.value)) return "";
        const data = compactChartData();
        for (const name of ["dimension_label", "metric_label", "unit", "period"]) {
          if (!data[name]) return `${name} is required`;
        }
        const [minimum, maximum] = pointLimits[treatment.value];
        if (data.points.length < minimum || data.points.length > maximum) {
          return `${treatment.value} requires ${minimum}-${maximum} points`;
        }
        const labels = new Set();
        for (const item of data.points) {
          if (!item.label) return "Every point needs a label";
          const key = item.label.toLocaleLowerCase();
          if (labels.has(key)) return "Point labels must be unique";
          labels.add(key);
          if (!Number.isFinite(item.value)) return "Every point needs a finite value";
          if (!item.evidence_refs.length) return "Every point needs evidence refs";
          if (item.evidence_refs.some((ref) => !card.evidence_refs.includes(ref))) {
            return "Point evidence must stay within the card evidence scope";
          }
        }
        const values = data.points.map((item) => item.value);
        if (treatment.value === "bar-chart" && (values.some((value) => value < 0) || !values.some((value) => value > 0))) {
          return "Bar values must be non-negative with at least one value above zero";
        }
        if (treatment.value === "pie-chart") {
          const total = values.reduce((sum, value) => sum + value, 0);
          if (values.some((value) => value < 0) || total <= 0) return "Pie values must be non-negative and sum above zero";
          const unit = data.unit.toLocaleLowerCase();
          if ((unit.includes("%") || ["percent", "percentage", "pct"].includes(unit)) && Math.abs(total - 100) > 0.000001) {
            return "Percentage pie values must sum to 100";
          }
        }
        return "";
      }

      row.compactChartData = compactChartData;
      row.chartValidationError = chartValidationError;

      for (const [name, input] of Object.entries(chartFields)) {
        input.addEventListener("input", () => {
          if (row.chartData) row.chartData[name] = input.value;
          updateAll();
        });
      }
      addPoint.addEventListener("click", () => {
        ensureChartData();
        const maximum = pointLimits[treatment.value][1];
        if (row.chartData.points.length < maximum) row.chartData.points.push(emptyPoint());
        renderPoints();
        updateAll();
      });

      function updatePreview() {
        preview.dataset.placement = placement.value;
        preview.dataset.chart = chartLayouts.has(treatment.value) ? "true" : "false";
        proxyCopy.textContent = `${treatment.value}\n${copy.value.trim() || card.card_type}`;
      }

      function updateChartEditor() {
        const isChart = chartLayouts.has(treatment.value);
        chartEditor.hidden = !isChart;
        if (!isChart) {
          chartError.textContent = "";
          return;
        }
        ensureChartData();
        syncChartFields();
        renderPoints();
        chartError.textContent = chartValidationError();
      }

      placement.addEventListener("change", updatePreview);
      treatment.addEventListener("change", () => {
        updatePreview();
        updateChartEditor();
        updateAll();
      });
      copy.addEventListener("input", updatePreview);
      updateChartEditor();
      updatePreview();
      form.append(fragment);
      return row;
    }

    const candidates = reviewData.cards.map(makeCandidate);

    function selectedCount() {
      return candidates.filter((row) => row.querySelector('[name="selected"]').checked).length;
    }
    function updateCount() {
      const selected = selectedCount();
      count.textContent = `${selected} selected / target ${target}`;
      count.classList.toggle("on-target", selected === target);
    }
    function buildSummary() {
      const selectedRows = candidates.filter((row) => row.querySelector('[name="selected"]').checked);
      if (selectedRows.length === 0) return "No cards selected yet.";
      return selectedRows
        .map((row) => {
          const id = row.dataset.cardId;
          const copy = row.querySelector('[name="copy"]').value;
          const treatment = row.querySelector('[name="visual_treatment"]').value;
          const placement = row.querySelector('[name="placement"]').value || "Unplaced";
          const firstLine = `${id} | ${treatment} | ${placement} | ${copy.replace(/\s+/g, " ").trim()}`;
          if (!chartLayouts.has(treatment)) return firstLine;
          return `${firstLine}\ndata=${JSON.stringify(row.compactChartData())}`;
        })
        .join("\n\n");
    }
    function updateSummary() {
      summaryOutput.textContent = buildSummary();
    }
    function updateAll() {
      updateCount();
      let hasInvalidSelectedChart = false;
      for (const row of candidates) {
        const treatment = row.querySelector('[name="visual_treatment"]').value;
        const error = row.chartValidationError();
        row.querySelector("[data-chart-error]").textContent = error;
        if (row.querySelector('[name="selected"]').checked && chartLayouts.has(treatment) && error) {
          hasInvalidSelectedChart = true;
        }
      }
      copyButton.disabled = hasInvalidSelectedChart;
      updateSummary();
    }
    for (const input of form.querySelectorAll('[name="selected"], [name="copy"], [name="visual_treatment"], [name="placement"]')) {
      input.addEventListener("change", updateAll);
      input.addEventListener("input", updateAll);
    }
    function legacyCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.append(textarea);
      textarea.select();
      const copied = document.execCommand("copy");
      textarea.remove();
      return copied;
    }
    async function copySummary(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (error) {
          // Local file clipboard permissions vary by browser; use the native fallback below.
        }
      }
      return legacyCopy(text);
    }
    copyButton.addEventListener("click", async () => {
      const copied = await copySummary(summaryOutput.textContent);
      if (!copied) {
        copyButton.textContent = "Copy failed";
        setTimeout(() => { copyButton.textContent = "Copy summary"; }, 1500);
        return;
      }
      copyButton.textContent = "Copied!";
      copyButton.classList.add("copied");
      setTimeout(() => {
        copyButton.textContent = "Copy summary";
        copyButton.classList.remove("copied");
      }, 1500);
    });
    updateAll();
  </script>
</body>
</html>
