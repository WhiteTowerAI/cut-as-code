<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caption preview review</title>
  <style>
    :root {
      --bg: #151719;
      --band: #1d2023;
      --surface: #24282b;
      --line: #3b4145;
      --text: #f2eee5;
      --muted: #aeb4b7;
      --accent: #4fc3b4;
      --warning: #f3bd5b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
    button, textarea, input { font: inherit; }
    button, textarea { min-height: 38px; }
    button { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 8px 14px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto 48px; }
    .toolbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; padding: 12px 0; background: var(--band); border-bottom: 1px solid var(--line); }
    .toolbar-band { position: sticky; top: 0; z-index: 4; background: var(--band); }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    #review-status { color: var(--muted); white-space: nowrap; }
    #review-form { display: grid; gap: 1px; margin-top: 24px; background: var(--line); border: 1px solid var(--line); }
    .evidence-row { display: grid; grid-template-columns: minmax(150px, .55fr) minmax(320px, 1.45fr); gap: 20px; padding: 20px; background: var(--surface); }
    .evidence-row[hidden] { display: none; }
    .evidence-meta { display: grid; align-content: start; gap: 10px; }
    .check-label { display: flex; align-items: center; gap: 10px; font-weight: 700; text-transform: capitalize; }
    .check-label input { inline-size: 20px; block-size: 20px; accent-color: var(--accent); }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    .preview-button { min-height: 0; padding: 0; border: 0; background: #000; aspect-ratio: 16 / 9; overflow: hidden; }
    .preview-button img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .expressive-review .preview-button { aspect-ratio: auto; }
    .expressive-review .preview-button img { height: auto; max-height: 720px; }
    .expressive-controls, .comparison { margin-top: 24px; padding: 18px; border: 1px solid var(--line); background: var(--band); }
    .expressive-controls h2, .comparison h2 { margin: 0 0 6px; font-size: 17px; }
    .expressive-controls p, .comparison p { margin: 0; color: var(--muted); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .filter-button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .variant-chip { width: max-content; border: 1px solid var(--line); padding: 2px 7px; color: var(--accent); font-size: 12px; font-weight: 800; }
    .warning-text { color: var(--warning); }
    .comparison-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
    .comparison-card { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); background: var(--surface); }
    .comparison-card h3 { margin: 0; font-size: 15px; }
    .decision { display: grid; grid-template-columns: minmax(240px, .7fr) minmax(320px, 1.3fr); gap: 24px; padding: 24px 0; }
    fieldset { min-width: 0; margin: 0; border: 1px solid var(--line); padding: 16px; }
    legend { padding: 0 6px; font-weight: 700; }
    .radio-row { display: flex; gap: 22px; }
    .radio-row label { display: flex; align-items: center; gap: 8px; min-height: 38px; }
    textarea { width: 100%; resize: vertical; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 10px; }
    textarea:disabled { opacity: .55; }
    .actions { display: flex; align-items: start; gap: 12px; }
    #copy-summary { background: var(--accent); border-color: var(--accent); color: #071c19; font-weight: 800; }
    #summary-output { flex: 1; min-height: 92px; margin: 0; padding: 12px; border: 1px solid var(--line); background: var(--band); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    #review-errors { min-height: 24px; margin-top: 10px; color: var(--warning); }
    dialog { width: min(1100px, calc(100% - 32px)); border: 1px solid var(--line); padding: 0; background: var(--bg); color: var(--text); }
    dialog::backdrop { background: rgb(0 0 0 / .82); }
    .dialog-bar { display: flex; justify-content: flex-end; padding: 10px; }
    dialog img { display: block; width: 100%; height: auto; max-height: calc(100vh - 90px); object-fit: contain; }
    @media (max-width: 1100px) { .evidence-row { grid-template-columns: minmax(140px, .45fr) 1fr; } }
    @media (max-width: 780px) {
      .shell { width: min(1180px, calc(100% - 32px)); }
      .toolbar, .decision, .evidence-row { grid-template-columns: 1fr; }
      .toolbar { align-items: flex-start; flex-direction: column; gap: 2px; }
      .actions { flex-direction: column; }
      #copy-summary, #summary-output { width: 100%; }
      .comparison-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="toolbar-band">
    <header class="toolbar shell">
      <h1>Caption preview review</h1>
      <div><strong id="review-status" aria-live="polite">0/4 checked</strong> <span id="machine-status"></span></div>
    </header>
  </div>
  <main class="shell">
    <section id="expressive-controls" class="expressive-controls" hidden>
      <h2>Expressive layout beat evidence</h2>
      <p>Review the complete Agent plan, then request only the beat-specific corrections that are needed.</p>
      <div class="filters" aria-label="Filter layout beat evidence">
        <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-button" type="button" data-filter="bottom-standard" aria-pressed="false">Bottom standard</button>
        <button class="filter-button" type="button" data-filter="center-emphasis" aria-pressed="false">Center emphasis</button>
        <button class="filter-button" type="button" data-filter="preset-bottom" aria-pressed="false">Preset bottom</button>
        <button class="filter-button" type="button" data-filter="frame-center" aria-pressed="false">Frame center</button>
        <button class="filter-button" type="button" data-filter="panel-center" aria-pressed="false">Panel center</button>
        <button class="filter-button" type="button" data-filter="hero-1.5x" aria-pressed="false">Hero 1.5x</button>
        <button class="filter-button" type="button" data-filter="warnings" aria-pressed="false">Warnings</button>
      </div>
    </section>
    <form id="review-form">
      <div id="evidence-list"></div>
    </form>
    <section id="comparison" class="comparison" hidden>
      <h2>Semantic + Karaoke comparison</h2>
      <p id="comparison-summary"></p>
      <div id="comparison-grid" class="comparison-grid"></div>
      <fieldset id="karaoke-choice">
        <legend>Final Karaoke</legend>
        <div class="radio-row">
          <label><input type="radio" name="karaoke" value="off"> Karaoke off</label>
          <label><input type="radio" name="karaoke" value="on"> Karaoke on</label>
        </div>
      </fieldset>
    </section>
    <section class="decision">
      <fieldset>
        <legend>Decision</legend>
        <div class="radio-row">
          <label><input type="radio" name="decision" value="approve" checked> Approve</label>
          <label><input type="radio" name="decision" value="revise"> Revise</label>
        </div>
      </fieldset>
      <label>Changes
        <textarea id="changes" rows="3" disabled></textarea>
      </label>
    </section>
    <div class="actions">
      <button id="copy-summary" type="button" disabled>Copy summary</button>
      <output id="summary-output" aria-live="polite"></output>
    </div>
    <div id="review-errors" role="alert" aria-live="assertive"></div>
  </main>
  <dialog id="preview-dialog" aria-label="Caption evidence preview">
    <div class="dialog-bar"><button id="close-preview" type="button" aria-label="Close preview">Close</button></div>
    <img id="dialog-image" alt="">
  </dialog>
  <script>
    const REVIEW_DATA_B64 = "__CAPTION_EVIDENCE_REVIEW_DATA__";
    const reviewData = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(REVIEW_DATA_B64), c => c.charCodeAt(0))));
    const isExpressive = reviewData.presentation_mode === "expressive";
    const isCompositeAware = Boolean(reviewData.spatial_context);
    const reviewSamples = reviewData.review_samples || reviewData.samples;
    const labels = reviewSamples.map(sample => sample.sample_label || sample.label);
    const form = document.querySelector("#review-form");
    const list = document.querySelector("#evidence-list");
    const status = document.querySelector("#review-status");
    const machineStatus = document.querySelector("#machine-status");
    const changes = document.querySelector("#changes");
    const copyButton = document.querySelector("#copy-summary");
    const output = document.querySelector("#summary-output");
    const errors = document.querySelector("#review-errors");
    const dialog = document.querySelector("#preview-dialog");
    const dialogImage = document.querySelector("#dialog-image");
    const expressiveControls = document.querySelector("#expressive-controls");
    const comparisonSection = document.querySelector("#comparison");
    const comparisonSummary = document.querySelector("#comparison-summary");
    const comparisonGrid = document.querySelector("#comparison-grid");
    let lastTrigger = null;

    const time = value => `${Number(value).toFixed(3)}s`;
    const addDetail = (details, name, value, className = "") => {
      const term = document.createElement("dt");
      term.textContent = name;
      const description = document.createElement("dd");
      description.textContent = value;
      if (className) description.className = className;
      details.append(term, description);
    };
    const bindPreview = (preview, image, source, alt) => {
      image.src = source;
      image.alt = alt;
      preview.append(image);
      preview.addEventListener("click", () => {
        lastTrigger = preview;
        dialogImage.src = source;
        dialogImage.alt = alt;
        dialog.showModal();
      });
    };
    if (isExpressive || isCompositeAware) {
      document.body.classList.add("expressive-review");
      expressiveControls.hidden = false;
    }
    machineStatus.textContent = `${reviewData.machine_evidence_count || reviewData.samples.length} machine samples passed`;
    for (const sample of reviewData.review_samples || reviewData.samples) {
      const row = document.createElement("article");
      row.className = "evidence-row";
      row.dataset.variant = sample.variant || "none";
      row.dataset.placement = sample.resolved_placement || "none";
      row.dataset.hero = sample.hero_line ? "hero-1.5x" : "none";
      row.dataset.categories = (sample.categories || []).join(" ");
      row.dataset.warning = sample.warnings?.length ? "true" : "false";
      const meta = document.createElement("div");
      meta.className = "evidence-meta";
      const checkLabel = document.createElement("label");
      checkLabel.className = "check-label";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.name = "evidence";
      checkbox.value = sample.sample_label || sample.label;
      checkLabel.append(checkbox, document.createTextNode(sample.beat_id || sample.sample_label || sample.label));
      for (const category of sample.categories || []) {
        const categoryChip = document.createElement("span");
        categoryChip.className = "variant-chip";
        categoryChip.textContent = category;
        meta.append(categoryChip);
      }
      if (sample.variant) {
        const chip = document.createElement("span");
        chip.className = "variant-chip";
        chip.textContent = sample.variant;
        meta.append(chip);
      }
      const details = document.createElement("dl");
      if (isExpressive && sample.kind === "layout-beat") {
        addDetail(details, "Beat", sample.beat_id);
        addDetail(details, "Variant", sample.variant);
        addDetail(details, "Cue IDs", sample.cue_ids.join(", "));
        addDetail(details, "Program", time(sample.program_s));
        addDetail(details, "Source", time(sample.source_s));
        addDetail(details, "Displayed", sample.displayed_text || "None");
        addDetail(details, "Emphasized", sample.emphasized_words?.join(", ") || "None");
        addDetail(details, "Warnings", sample.warnings?.join(" ") || "None", sample.warnings?.length ? "warning-text" : "");
        addDetail(details, "SHA-256", sample.sha256);
      } else {
        addDetail(details, "Program", time(sample.program_s));
        addDetail(details, "Source", time(sample.source_s));
        addDetail(details, "Cue", sample.cue_text || "None");
        addDetail(details, "SHA-256", sample.sha256);
      }
      if (sample.spatial_beat_id) {
        addDetail(details, "Visual context", sample.visual_context);
        addDetail(details, "Requested", sample.requested_variant);
        addDetail(details, "Resolved", sample.resolved_placement);
        addDetail(details, "Background", `${sample.background_kind}: ${sample.background_path}`);
        addDetail(details, "Background SHA-256", sample.background_sha256);
        addDetail(details, "Caption bbox", JSON.stringify(sample.caption_bbox));
        addDetail(details, "Hero bbox", JSON.stringify(sample.hero_bbox));
        addDetail(details, "Allowed rect", JSON.stringify(sample.allowed_rect_px));
        addDetail(details, "Clearance", sample.clearance_status);
      }
      if (sample.hero_line) addDetail(details, "Hero level", sample.hero_line.level);
      meta.append(checkLabel, details);
      const preview = document.createElement("button");
      preview.type = "button";
      preview.className = "preview-button";
      preview.setAttribute("aria-label", `Enlarge ${sample.label} preview`);
      const image = document.createElement("img");
      bindPreview(preview, image, sample.preview, `${sample.label} composited caption evidence`);
      row.append(meta, preview);
      list.append(row);
    }

    if (isExpressive && reviewData.experimental_comparison) {
      const comparison = reviewData.experimental_comparison;
      comparisonSection.hidden = false;
      comparisonSummary.textContent = `Supported coexistence evidence; separately bound from the ${labels.length}-frame primary approval count. Beat ${comparison.beat_id}, ${comparison.variant}, ${time(comparison.program_s)} program / ${time(comparison.source_s)} source.`;
      for (const sample of comparison.samples) {
        const card = document.createElement("article");
        card.className = "comparison-card";
        const heading = document.createElement("h3");
        heading.textContent = sample.karaoke ? "Semantic emphasis + Karaoke on" : "Semantic emphasis only (Karaoke off)";
        const hash = document.createElement("code");
        hash.textContent = sample.sha256;
        const preview = document.createElement("button");
        preview.type = "button";
        preview.className = "preview-button";
        preview.setAttribute("aria-label", `Enlarge ${sample.mode} comparison`);
        const image = document.createElement("img");
        bindPreview(preview, image, sample.preview, `${sample.mode} comparison`);
        card.append(heading, preview, hash);
        comparisonGrid.append(card);
      }
    }

    for (const button of document.querySelectorAll(".filter-button")) {
      button.addEventListener("click", () => {
        const filter = button.dataset.filter;
        for (const candidate of document.querySelectorAll(".filter-button")) {
          candidate.setAttribute("aria-pressed", String(candidate === button));
        }
        for (const row of document.querySelectorAll(".evidence-row")) {
          row.hidden = filter !== "all" && !(
            filter === "warnings" ? row.dataset.warning === "true"
              : row.dataset.categories.split(" ").includes(filter)
                || row.dataset.variant === filter || row.dataset.placement === filter || row.dataset.hero === filter
          );
        }
      });
    }

    const summary = () => {
      const decision = form.ownerDocument.querySelector('input[name="decision"]:checked').value;
      if (decision === "revise") {
        return `Caption preview review\nReview: ${reviewData.review_id}\nDecision: revise\nChanges: ${changes.value.trim()}`;
      }
      const evidence = reviewData.approval_evidence === "composite-aware"
        ? "composite-aware"
        : isExpressive ? "expressive-layout-beats" : "early, middle, late, no-caption";
      const approval = `Caption preview review\nReview: ${reviewData.review_id}\nDecision: approve\nEvidence: ${evidence}`;
      const karaokeChoice = document.querySelector('input[name="karaoke"]:checked');
      return isExpressive && karaokeChoice ? `${approval}\nKaraoke: ${karaokeChoice.value}` : approval;
    };
    const update = () => {
      const checked = [...form.querySelectorAll('input[name="evidence"]:checked')];
      const decision = document.querySelector('input[name="decision"]:checked').value;
      const karaokeChoice = document.querySelector('input[name="karaoke"]:checked');
      const valid = decision === "approve"
        ? checked.length === labels.length && (!isExpressive || Boolean(karaokeChoice))
        : Boolean(changes.value.trim());
      status.textContent = `${checked.length}/${labels.length} checked`;
      changes.disabled = decision !== "revise";
      copyButton.disabled = !valid;
      output.textContent = summary();
      errors.textContent = valid ? "" : decision === "revise"
        ? "Describe the requested changes."
        : checked.length !== labels.length
          ? `Check all ${labels.length} primary evidence frames to approve.`
          : "Choose Karaoke off or on to approve the Expressive preview.";
    };
    document.addEventListener("input", update);
    document.addEventListener("change", update);
    copyButton.addEventListener("click", async () => {
      const text = summary();
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.append(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      output.textContent = text;
    });
    document.querySelector("#close-preview").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); });
    dialog.addEventListener("close", () => lastTrigger?.focus({ preventScroll: true }));
    update();
  </script>
</body>
</html>
