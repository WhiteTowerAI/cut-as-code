<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>like-burst - HyperFrames</title>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>like-burst · motion-anything recipe</title>
  <link rel="stylesheet" href="source/like-burst.css" />
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, #fff 0%, #f4f5f7 100%);
      color: #1a1d24;
    }
    .stage { text-align: center; }
    .badge {
      display: inline-block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      color: #8b909a; margin-bottom: 18px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { margin: 0 0 32px; color: #6b7280; font-size: 14px; }
    .row { display: flex; gap: 28px; justify-content: center; align-items: center; }
    .hint { margin-top: 34px; font-size: 13px; color: #9aa0aa; }
    code { background: #eceef1; padding: 2px 6px; border-radius: 5px; font-size: 12px; }
  </style>

  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body[data-composition-id] { position: relative; box-sizing: border-box; background: transparent !important; }
  </style>
</head>
<body data-composition-id="like-burst" data-start="0" data-width="1920" data-height="1080" data-duration="6" data-no-timeline>

  <div class="stage">
    
    <h1>Like Burst</h1>
    <p class="sub">Tap a heart. Delight fires on the <em>like</em>, never on load.</p>

    <div class="row">
      <button class="like-btn" data-like-burst aria-pressed="false" aria-label="Like">♥</button>
      <button class="like-btn" data-like-burst aria-pressed="false" aria-label="Like">♥</button>
      <button class="like-btn" data-like-burst aria-pressed="false" aria-label="Like">♥</button>
    </div>

    
  </div>

  

  <script src="hf-recipe.js"></script>
  <script src="hf-adapter.js"></script>
</body>
</html>
