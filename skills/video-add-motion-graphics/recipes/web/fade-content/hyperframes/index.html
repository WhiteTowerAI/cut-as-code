<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;gap:20px;text-align:center;font-family:ui-sans-serif,system-ui,sans-serif;background:radial-gradient(120% 120% at 50% 0%,#1b1c24,#0b0b12);color:#e7e8ee}.badge{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8b7cf6}.hint{font-size:13px;color:#7c7f8c;max-width:360px}h1{margin:0}</style>
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body[data-composition-id] { position: relative; box-sizing: border-box; background: transparent !important; }
  </style>

<body data-composition-id="fade-content" data-start="0" data-width="1920" data-height="1080" data-duration="6" data-no-timeline>
<div style="display:grid;gap:14px"><div class="fade-content" style="background:#14151c;border:1px solid #2a2b36;border-radius:12px;padding:20px 26px">Scroll me into view ↓</div><div class="fade-content" style="--fc-delay:120ms;background:#14151c;border:1px solid #2a2b36;border-radius:12px;padding:20px 26px">…staggered by delay</div></div>
