spec_version: 1
id: mojs-celebration-burst
name: "Celebration Particle Burst"
description: "Colorful particles expanding in a compact celebratory burst."
surfaces: [video]
category: sticker-celebration
tech: [js]
canvas: [video]
target: [overlay]
intent: sticker-celebration
runtime: ["js"]
export: [skill, html]
dependencies: []
tags: ["particles", "celebration", "radial", "compact", "burst", "festive", "positive", "reveal"]
intent_keywords:
  - "celebration burst"
  - "party particles"
  - "celebration"
  - "celebrate"
  - "achievement"
  - "milestone"
  - "launch"
  - "won"
  - "festive reveal"
  - "celebration burst icon"
  - "庆祝爆发"
  - "派对粒子"
  - "庆祝"
  - "赢了"
  - "喜庆揭晓"
  - "成就"
best_for:
  - "A spoken reference to celebration burst needs a compact, immediately recognizable cue"
  - "A genuine positive achievement or announcement deserves a festive visual payoff"
avoid_when:
  - "The spoken meaning does not refer to celebration burst or a close synonym"
  - "The event is neutral, negative, sensitive, or not genuinely celebratory"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: js
    files: ["vendor.js", "effect.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/mojs/mojs/blob/0a9cf9a87dd5637e6fa770755e79048489bcf817/dist/mo.umd.js"
  attribution_required: true
author:
  name: "Oleg Solomka and mo.js contributors"
  url: "https://github.com/mojs/mojs"
version: 1.7.1
