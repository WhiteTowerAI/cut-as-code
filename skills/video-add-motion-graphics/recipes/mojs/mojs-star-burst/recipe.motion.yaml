spec_version: 1
id: mojs-star-burst
name: "Star Polygon Burst"
description: "Small star polygons radiating from a reaction point."
surfaces: [video]
category: sticker-reaction
tech: [js]
canvas: [video]
target: [overlay]
intent: sticker-reaction
runtime: ["js"]
export: [skill, html]
dependencies: []
tags: ["stars", "polygon", "radial", "reaction", "star", "affection", "positive", "reveal"]
intent_keywords:
  - "star reaction"
  - "rating burst"
  - "love"
  - "appreciation"
  - "favorite"
  - "thank you"
  - "star"
  - "audience reaction"
  - "rating"
  - "star reaction icon"
  - "星星回应"
  - "评分爆发"
  - "喜欢"
  - "感谢"
  - "爱心回应"
  - "收藏"
best_for:
  - "A spoken reference to star reaction needs a compact, immediately recognizable cue"
  - "The narration expresses affection, appreciation, approval, or a favorite"
avoid_when:
  - "The spoken meaning does not refer to star reaction or a close synonym"
  - "The cue is a formal completion status rather than an emotional reaction"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: js
    files: ["vendor.js", "effect.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/mojs/mojs/blob/0a9cf9a87dd5637e6fa770755e79048489bcf817/dist/mo.umd.js"
  attribution_required: true
author:
  name: "Oleg Solomka and mo.js contributors"
  url: "https://github.com/mojs/mojs"
version: 1.7.1
