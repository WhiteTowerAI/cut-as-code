spec_version: 1
id: "codrops-fullscreenscroll-index"
name: "Fullscreen Scrolling Slideshow"
description: "A dark fullscreen slideshow scrolls image and text pairs through a cinematic field."
surfaces: [video]
category: "fullscreen-chapter"
tech: [html, css, js]
canvas: [video]
target: [fullscreen]
intent: "fullscreen-chapter"
runtime: [css, js]
export: [skill, html]
dependencies: []
tags:
  - "codrops"
  - "fullscreen"
  - "slideshow"
  - "cinematic"
  - "chapter"
  - "outro"
  - "dark"
intent_keywords:
  - "cinematic fullscreen chapter"
  - "dark image slideshow"
  - "story interstitial"
  - "电影感章节"
  - "全屏幻灯片"
best_for:
  - "A chapter, interstitial, or outro for cinematic essays, trailers, and mood-led travel stories"
  - "A fullscreen sequence where image and a short title can replace the demo content"
avoid_when:
  - "The edit is upbeat, data-heavy, or requires many simultaneous labels"
  - "The footage must remain visible as literal continuity behind the graphics"
structural_roles:
  - "chapter"
  - "interstitial"
  - "outro"
motion_functions:
  - "transition"
  - "loop"
  - "settle"
visual_language:
  - "cinematic"
  - "editorial"
  - "dark"
mechanisms:
  - "fullscreen-scroll"
  - "image-slideshow"
  - "text-pairing"
rhythm_energy: "medium"
information_density: "balanced"
frame_relationship: "fullscreen"
color_tendency: "dark"
style_rationale: "The reviewed dark frame uses a large image-and-title pair moving through a full-screen slideshow, which reads as a cinematic section pause."
restraint:
  max_per_view: 1
  notes: "Use as one frame-dominant designed cutaway; adapt content, palette, typography, framing, and timing instead of running an unchanged source showcase."
motion:
  duration_ms: 8000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: "index/index.html"
implementations:
  - tech: js
    files: ["index/index.html", "index/hf-recipe.js", "index/hf-adapter.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt imagery, palette, typography, framing, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/codrops/FullscreenScroll/tree/797ae92855cde470624e3377ded58c64730384e2"
  attribution_required: true
author:
  name: "codrops"
  url: "https://github.com/codrops"
version: 0.1.0
