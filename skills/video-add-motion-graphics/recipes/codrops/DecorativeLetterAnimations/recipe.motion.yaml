spec_version: 1
id: "codrops-decorativeletteranimations-index"
name: "Decorative Letter Animations"
description: "Oversized decorative letters cycle through expressive display treatments."
surfaces: [video]
category: "fullscreen-typography"
tech: [html, css, js]
canvas: [video]
target: [fullscreen]
intent: "fullscreen-typography"
runtime: [css, js]
export: [skill, html]
dependencies: []
tags:
  - "codrops"
  - "typography"
  - "letters"
  - "display"
  - "opener"
  - "chapter"
  - "fullscreen"
intent_keywords:
  - "kinetic title opener"
  - "decorative letter transition"
  - "experimental typography"
  - "动态文字开场"
  - "装饰字母转场"
best_for:
  - "An opener, chapter, or interstitial for music, design, youth-culture, and experimental edits"
  - "A fullscreen title beat with a short adaptable phrase"
avoid_when:
  - "The narration needs dense factual text or a sober corporate tone"
  - "The cue must preserve readable footage continuously behind the title"
structural_roles:
  - "opener"
  - "chapter"
  - "interstitial"
motion_functions:
  - "reveal"
  - "transition"
  - "build"
visual_language:
  - "typographic"
  - "experimental"
  - "playful"
mechanisms:
  - "display-type"
  - "letter-animation"
  - "slide-change"
rhythm_energy: "high"
information_density: "balanced"
frame_relationship: "fullscreen"
color_tendency: "flexible"
style_rationale: "Large changing letterforms visibly own the frame and create an energetic sequence of title-reveal states."
restraint:
  max_per_view: 1
  notes: "Use as one frame-dominant designed cutaway; adapt content, palette, typography, framing, and timing instead of running an unchanged source showcase."
motion:
  duration_ms: 18000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: "index/index.html"
implementations:
  - tech: js
    files: ["index/index.html", "index/hf-recipe.js", "index/hf-adapter.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt imagery, palette, typography, framing, and timing to the shot."
license:
