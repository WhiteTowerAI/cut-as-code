spec_version: 1
id: "codrops-columnscroll-index"
name: "Alternate Column Scroll Animation"
description: "Tall editorial images and serif type travel in alternating columns."
surfaces: [video]
category: "fullscreen-chapter"
tech: [html, css, js]
canvas: [video]
target: [fullscreen]
intent: "fullscreen-chapter"
runtime: [css, js]
export: [skill, html]
dependencies: []
tags:
  - "codrops"
  - "columns"
  - "editorial"
  - "fashion"
  - "scroll"
  - "chapter"
  - "fullscreen"
intent_keywords:
  - "editorial column montage"
  - "fashion chapter card"
  - "vertical image movement"
  - "图片列动画"
  - "时尚章节"
best_for:
  - "A chapter or interstitial for fashion, architecture, travel, and art-direction videos"
  - "A fullscreen editorial sequence built from vertical image crops and short titles"
avoid_when:
  - "The subject requires stable readable captions over the same frame"
  - "The footage is informal, literal, or has no compatible image material"
structural_roles:
  - "chapter"
  - "interstitial"
  - "background"
motion_functions:
  - "loop"
  - "transition"
visual_language:
  - "editorial"
  - "fashion"
  - "typographic"
mechanisms:
  - "columns"
  - "image-panels"
  - "scroll"
rhythm_energy: "medium"
information_density: "balanced"
frame_relationship: "fullscreen"
color_tendency: "image-led"
style_rationale: "The visible alternating image columns and large serif treatment read as a scrolling magazine spread that can carry a section beat."
restraint:
  max_per_view: 1
  notes: "Use as one frame-dominant designed cutaway; adapt content, palette, typography, framing, and timing instead of running an unchanged source showcase."
motion:
  duration_ms: 8000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: "index/index.html"
implementations:
  - tech: js
    files: ["index/index.html", "index/hf-recipe.js", "index/hf-adapter.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt imagery, palette, typography, framing, and timing to the shot."
license:
  spdx: MIT
