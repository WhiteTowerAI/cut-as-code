spec_version: 1
id: "codrops-previewcontenttransition-index"
name: "Preview to Full Content Page Transition"
description: "A clean preview card opens into a large editorial content page."
surfaces: [video]
category: "fullscreen-transition"
tech: [html, css, js]
canvas: [video]
target: [fullscreen]
intent: "fullscreen-transition"
runtime: [css, js]
export: [skill, html]
dependencies: []
tags:
  - "codrops"
  - "preview"
  - "content"
  - "page"
  - "editorial"
  - "transition"
  - "fullscreen"
intent_keywords:
  - "preview to content transition"
  - "editorial page reveal"
  - "article chapter card"
  - "预览转内容页"
  - "文章章节转场"
best_for:
  - "A chapter or interstitial in documentary essays, editorial videos, and product stories"
  - "A fullscreen transition from a short teaser phrase to one controlled content statement"
avoid_when:
  - "The cue needs high-energy spectacle or imagery as the dominant element"
  - "The program already has dense text or captions occupying the screen"
structural_roles:
  - "chapter"
  - "interstitial"
motion_functions:
  - "reveal"
  - "transition"
  - "settle"
visual_language:
  - "editorial"
  - "minimal"
  - "typographic"
mechanisms:
  - "preview-to-content"
  - "page-reveal"
  - "type"
rhythm_energy: "medium"
information_density: "balanced"
frame_relationship: "fullscreen"
color_tendency: "light"
style_rationale: "The reviewed pale page grows from a preview state into a readable editorial content layout, clearly designed for a section handoff."
restraint:
  max_per_view: 1
  notes: "Use as one frame-dominant designed cutaway; adapt content, palette, typography, framing, and timing instead of running an unchanged source showcase."
motion:
  duration_ms: 8000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: "index/index.html"
implementations:
  - tech: js
    files: ["index/index.html", "index/hf-recipe.js", "index/hf-adapter.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt imagery, palette, typography, framing, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/codrops/PreviewContentTransition/tree/04ac51cf5093cfc0ae1e0eee5e6de6da28c66518"
  attribution_required: true
author:
  name: "codrops"
  url: "https://github.com/codrops"
version: 0.1.0
