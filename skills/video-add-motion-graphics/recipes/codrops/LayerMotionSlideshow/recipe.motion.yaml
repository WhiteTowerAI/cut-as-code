spec_version: 1
id: "codrops-layermotionslideshow-index"
name: "Layer Motion Slideshow"
description: "Layered images and type slide through a refined editorial slideshow."
surfaces: [video]
category: "fullscreen-chapter"
tech: [html, css, js]
canvas: [video]
target: [fullscreen]
intent: "fullscreen-chapter"
runtime: [css, js]
export: [skill, html]
dependencies: []
tags:
  - "codrops"
  - "layers"
  - "slideshow"
  - "fashion"
  - "editorial"
  - "chapter"
  - "fullscreen"
intent_keywords:
  - "layered image slideshow"
  - "fashion chapter transition"
  - "editorial photo sequence"
  - "分层图片幻灯片"
  - "时尚章节转场"
best_for:
  - "A chapter, interstitial, or outro in fashion, travel, photography, and art films"
  - "A fullscreen sequence with a short title, one hero image, and controlled layer movement"
avoid_when:
  - "The footage needs continuous direct-to-camera presence"
  - "The visual material is too busy for overlapping images and text"
structural_roles:
  - "chapter"
  - "interstitial"
  - "outro"
motion_functions:
  - "transition"
  - "loop"
  - "settle"
visual_language:
  - "editorial"
  - "fashion"
  - "cinematic"
mechanisms:
  - "layers"
  - "slideshow"
  - "image-panels"
rhythm_energy: "medium"
information_density: "balanced"
frame_relationship: "fullscreen"
color_tendency: "image-led"
style_rationale: "The viewed composition layers a portrait, title, and supporting text in a paced magazine-like slide change."
restraint:
  max_per_view: 1
  notes: "Use as one frame-dominant designed cutaway; adapt content, palette, typography, framing, and timing instead of running an unchanged source showcase."
motion:
  duration_ms: 8000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: "index/index.html"
implementations:
  - tech: js
    files: ["index/index.html", "index/hf-recipe.js", "index/hf-adapter.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt imagery, palette, typography, framing, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/codrops/LayerMotionSlideshow/tree/a382863bb5963d26721f86546f0ec5261cc4f7ac"
  attribution_required: true
author:
  name: "codrops"
  url: "https://github.com/codrops"
version: 0.1.0
