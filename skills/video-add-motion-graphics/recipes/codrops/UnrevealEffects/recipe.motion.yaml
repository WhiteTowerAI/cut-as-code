spec_version: 1
id: "codrops-unrevealeffects-index"
name: "Unreveal Effects for Content Previews"
description: "Large serif words and image panels are concealed or uncovered through elegant effects."
surfaces: [video]
category: "fullscreen-transition"
tech: [html, css, js]
canvas: [video]
target: [fullscreen]
intent: "fullscreen-transition"
runtime: [css, js]
export: [skill, html]
dependencies: []
tags:
  - "codrops"
  - "unreveal"
  - "images"
  - "serif"
  - "fashion"
  - "transition"
  - "fullscreen"
intent_keywords:
  - "elegant image unreveal"
  - "serif title transition"
  - "fashion editorial outro"
  - "优雅图片退场"
  - "衬线标题转场"
best_for:
  - "A chapter, interstitial, or outro for fashion, beauty, romance, and cinematic editorial pieces"
  - "A fullscreen transition that reveals or conceals one title and one art-directed image panel"
avoid_when:
  - "The cue needs blunt utilitarian messaging, rapid data, or naturalistic continuity"
  - "The selected image needs full face readability or conflicts with subtitles"
structural_roles:
  - "chapter"
  - "interstitial"
  - "outro"
motion_functions:
  - "reveal"
  - "transition"
  - "settle"
visual_language:
  - "editorial"
  - "fashion"
  - "cinematic"
mechanisms:
  - "unreveal"
  - "image-panel"
  - "serif-type"
rhythm_energy: "medium"
information_density: "balanced"
frame_relationship: "fullscreen"
color_tendency: "flexible"
style_rationale: "The reviewed olive and rust pages use large serif words with a central image panel, creating a refined reveal/unreveal section ending."
restraint:
  max_per_view: 1
  notes: "Use as one frame-dominant designed cutaway; adapt content, palette, typography, framing, and timing instead of running an unchanged source showcase."
motion:
  duration_ms: 8000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: "index/index.html"
implementations:
  - tech: js
    files: ["index/index.html", "index/hf-recipe.js", "index/hf-adapter.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt imagery, palette, typography, framing, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/codrops/UnrevealEffects/tree/3459952fc60fc3c4d9fb3f6dbf9e19097659bfa8"
  attribution_required: true
author:
  name: "codrops"
  url: "https://github.com/codrops"
version: 0.1.0
