spec_version: 1
id: "codrops-scrollbasedlayoutanimations-index"
name: "Scroll-Based Layout Animations"
description: "A row of repeated portraits and color panels shifts across a wide editorial layout."
surfaces: [video]
category: "fullscreen-chapter"
tech: [html, css, js]
canvas: [video]
target: [fullscreen]
intent: "fullscreen-chapter"
runtime: [css, js]
export: [skill, html]
dependencies: []
tags:
  - "codrops"
  - "layout"
  - "portraits"
  - "scroll"
  - "fashion"
  - "chapter"
  - "fullscreen"
intent_keywords:
  - "scrolling portrait layout"
  - "editorial image sequence"
  - "fashion chapter motion"
  - "滚动肖像布局"
  - "时尚章节动画"
best_for:
  - "A chapter, interstitial, or background treatment in fashion, beauty, and creative-portfolio edits"
  - "A fullscreen layout built from one coherent image series rather than speaker footage"
avoid_when:
  - "The repeated subject is a protected person or documentary evidence"
  - "The cue needs a sparse neutral background or restrained corporate style"
structural_roles:
  - "chapter"
  - "interstitial"
  - "background"
motion_functions:
  - "loop"
  - "transition"
  - "build"
visual_language:
  - "editorial"
  - "fashion"
  - "playful"
mechanisms:
  - "repeated-images"
  - "layout-shift"
  - "scroll"
rhythm_energy: "medium-high"
information_density: "dense"
frame_relationship: "fullscreen"
color_tendency: "image-led"
style_rationale: "The visible default uses repeated portrait slices across a wide colored layout, creating a dense editorial sequence with continuous lateral movement."
restraint:
  max_per_view: 1
  notes: "Use as one frame-dominant designed cutaway; adapt content, palette, typography, framing, and timing instead of running an unchanged source showcase."
motion:
  duration_ms: 8000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: "index/index.html"
implementations:
  - tech: js
    files: ["index/index.html", "index/hf-recipe.js", "index/hf-adapter.js"]
    usage: "Materialize the converted HyperFrames directory, then adapt imagery, palette, typography, framing, and timing to the shot."
