  - "shape-mask"
  - "slideshow"
  - "image-reveal"
rhythm_energy: "medium"
information_density: "balanced"
frame_relationship: "fullscreen"
color_tendency: "dark"
style_rationale: "The visible image scenes are revealed by a large circle or shape mask with concise type, a cinematic full-screen section device."
restraint:
  max_per_view: 1
