spec_version: 1
id: "codrops-onscrolltypographyanimations-index"
name: "On-Scroll Typography Animations"
description: "Bold full-screen type animates across graphic color fields."
surfaces: [video]
category: "fullscreen-typography"
tech: [html, css, js]
canvas: [video]
target: [fullscreen]
intent: "fullscreen-typography"
runtime: [css, js]
export: [skill, html]
dependencies: []
tags:
  - "codrops"
  - "typography"
  - "kinetic"
  - "color"
  - "experimental"
  - "opener"
  - "fullscreen"
intent_keywords:
  - "bold kinetic typography"
  - "graphic title transition"
  - "experimental type opener"
  - "粗体动态排版"
  - "图形标题转场"
best_for:
  - "An opener, chapter, or interstitial for music, technology, youth-culture, and energetic explainers"
  - "A fullscreen message with a few large readable words"
avoid_when:
  - "The production requires quiet luxury, documentary naturalism, or long text"
  - "The title would collide with required captions or visible footage"
structural_roles:
  - "opener"
  - "chapter"
  - "interstitial"
motion_functions:
  - "reveal"
  - "build"
  - "transition"
visual_language:
  - "typographic"
  - "experimental"
  - "futuristic"
mechanisms:
  - "kinetic-type"
  - "color-field"
  - "scroll"
rhythm_energy: "high"
