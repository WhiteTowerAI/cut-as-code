spec_version: 1
id: line-md-document-report
name: "Document Report"
description: "A compact document report icon uses draw-in motion to illustrate a literal physical object, place, food, vehicle, or everyday item."
surfaces: [video]
category: sticker-object
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-object
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["document", "report", "draw-in", "object", "literal", "everyday", "compact"]
intent_keywords:
  - "document report"
  - "document report icon"
  - "document report symbol"
  - "document report animation"
  - "document report visual cue"
  - "show document report"
  - "animated document report"
  - "文档"
  - "文档图标"
  - "文档动画"
  - "文档提示"
best_for:
  - "A spoken reference to document report needs a compact, immediately recognizable cue"
  - "The named object itself is visually useful and immediately recognizable in context"
avoid_when:
  - "The spoken meaning does not refer to document report or a close synonym"
  - "The object name is metaphorical or a more specific semantic category communicates the point better"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
