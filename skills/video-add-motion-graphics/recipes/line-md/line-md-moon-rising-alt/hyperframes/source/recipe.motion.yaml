spec_version: 1
id: line-md-moon-rising-alt
name: "Moon Rising Alt"
description: "A compact moon rising alt icon uses draw-in, morph, looping motion to illustrate literal weather, a forecast, climate, or an environmental condition."
surfaces: [video]
category: sticker-weather
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-weather
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["moon", "rising", "draw-in", "morph", "looping", "alt", "weather", "forecast"]
intent_keywords:
  - "moon rising alt"
  - "moon rising alt icon"
  - "moon rising alt symbol"
  - "thunderstorm forecast"
  - "rain"
  - "sunny weather"
  - "snow"
  - "clear night"
  - "weather"
  - "sky"
  - "月亮"
  - "雷暴天气预报"
  - "下大雨"
  - "晴朗天气"
  - "下雪"
  - "晴朗夜空"
best_for:
  - "A spoken reference to moon rising alt needs a compact, immediately recognizable cue"
  - "The speaker literally refers to current weather, a forecast, or an environmental condition"
avoid_when:
  - "The spoken meaning does not refer to moon rising alt or a close synonym"
  - "Weather language is metaphorical, such as a storm of criticism or a sunny outlook"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
