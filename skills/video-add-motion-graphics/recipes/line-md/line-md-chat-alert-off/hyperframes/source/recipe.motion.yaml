spec_version: 1
id: line-md-chat-alert-off
name: "Chat Alert Off"
description: "A compact chat alert off icon uses draw-in motion to illustrate danger, risk, failure, caution, or an urgent problem."
surfaces: [video]
category: sticker-warning
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-warning
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["chat", "alert", "off", "draw-in", "warning", "urgent", "caution", "compact"]
intent_keywords:
  - "chat alert off"
  - "chat alert off icon"
  - "chat alert off symbol"
  - "chat alert off animation"
  - "chat alert off visual cue"
  - "show chat alert off"
  - "animated chat alert off"
  - "聊天警告"
  - "聊天警告图标"
  - "聊天警告动画"
  - "聊天警告提示"
best_for:
  - "A spoken reference to chat alert off needs a compact, immediately recognizable cue"
  - "The spoken point identifies a real risk, failure, hazard, or urgent exception"
avoid_when:
  - "The spoken meaning does not refer to chat alert off or a close synonym"
  - "The message is neutral, routine, positive, or too speculative to justify alarm"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
