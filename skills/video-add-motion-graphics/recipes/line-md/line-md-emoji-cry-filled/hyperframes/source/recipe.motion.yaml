spec_version: 1
id: line-md-emoji-cry-filled
name: "Emoji Cry (Filled)"
description: "A compact emoji cry icon uses draw-in, fade motion to illustrate affection, appreciation, a favorite, or a positive audience reaction."
surfaces: [video]
category: sticker-reaction
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-reaction
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["emoji", "cry", "draw-in", "fade", "reaction", "affection", "positive", "compact", "filled"]
intent_keywords:
  - "emoji cry"
  - "emoji cry icon"
  - "emoji cry symbol"
  - "emoji cry animation"
  - "emoji cry visual cue"
  - "show emoji cry"
  - "animated emoji cry"
  - "喜欢"
  - "喜欢图标"
  - "喜欢动画"
  - "喜欢提示"
best_for:
  - "A spoken reference to emoji cry needs a compact, immediately recognizable cue"
  - "The narration expresses affection, appreciation, approval, or a favorite"
avoid_when:
  - "The spoken meaning does not refer to emoji cry or a close synonym"
  - "The cue is a formal completion status rather than an emotional reaction"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
