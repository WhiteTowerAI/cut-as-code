spec_version: 1
id: line-md-clipboard-twotone
name: "Clipboard Reveal (Twotone)"
description: "A compact clipboard icon uses draw-in motion to illustrate a literal physical object, place, food, vehicle, or everyday item."
surfaces: [video]
category: sticker-object
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-object
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["clipboard", "draw-in", "object", "literal", "everyday", "compact", "twotone"]
intent_keywords:
  - "clipboard"
  - "clipboard icon"
  - "clipboard symbol"
  - "clipboard animation"
  - "clipboard visual cue"
  - "show clipboard"
  - "animated clipboard"
  - "剪贴板"
  - "剪贴板图标"
  - "剪贴板动画"
  - "剪贴板提示"
best_for:
  - "A spoken reference to clipboard needs a compact, immediately recognizable cue"
  - "The named object itself is visually useful and immediately recognizable in context"
avoid_when:
  - "The spoken meaning does not refer to clipboard or a close synonym"
  - "The object name is metaphorical or a more specific semantic category communicates the point better"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
