spec_version: 1
id: line-md-download-outline
name: "Download Reveal (Outline)"
description: "A compact download icon uses draw-in, morph, looping motion to illustrate a concrete viewer action, command, or media control."
surfaces: [video]
category: sticker-action
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-action
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["download", "draw-in", "morph", "looping", "action", "control", "instruction", "compact", "outline"]
intent_keywords:
  - "download"
  - "download icon"
  - "download symbol"
  - "upload"
  - "play"
  - "pause"
  - "start"
  - "action"
  - "continue"
  - "download animation"
  - "下载"
  - "下载文件"
  - "上传文档"
  - "播放"
  - "暂停"
  - "操作"
best_for:
  - "A spoken reference to download needs a compact, immediately recognizable cue"
  - "The speaker gives a clear instruction or names a specific control action"
avoid_when:
  - "The spoken meaning does not refer to download or a close synonym"
  - "The verb is metaphorical or the audience is not expected to perform the action"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
