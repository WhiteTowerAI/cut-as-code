spec_version: 1
id: line-md-account
name: "Account Reveal"
description: "A compact account icon uses draw-in motion to illustrate a person, profile, account, contact, speaker, or community."
surfaces: [video]
category: sticker-people-lifestyle
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-people-lifestyle
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["account", "draw-in", "people", "profile", "social", "compact"]
intent_keywords:
  - "account"
  - "account icon"
  - "account symbol"
  - "account animation"
  - "account visual cue"
  - "show account"
  - "animated account"
  - "账户"
  - "账户图标"
  - "账户动画"
  - "账户提示"
best_for:
  - "A spoken reference to account needs a compact, immediately recognizable cue"
  - "A person, user, contact, account, or community role is explicitly discussed"
avoid_when:
  - "The spoken meaning does not refer to account or a close synonym"
  - "The cue concerns an organization or abstract audience rather than an identifiable person role"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
