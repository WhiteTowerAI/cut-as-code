spec_version: 1
id: line-md-filter-off-filled
name: "Filter Off (Filled)"
description: "A compact filter off icon uses draw-in motion to illustrate a concrete viewer action, command, or media control."
surfaces: [video]
category: sticker-action
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-action
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["filter", "off", "draw-in", "action", "control", "instruction", "compact", "filled"]
intent_keywords:
  - "filter off"
  - "filter off icon"
  - "filter off symbol"
  - "filter off animation"
  - "filter off visual cue"
  - "show filter off"
  - "animated filter off"
  - "筛选"
  - "筛选图标"
  - "筛选动画"
  - "筛选提示"
best_for:
  - "A spoken reference to filter off needs a compact, immediately recognizable cue"
  - "The speaker gives a clear instruction or names a specific control action"
avoid_when:
  - "The spoken meaning does not refer to filter off or a close synonym"
  - "The verb is metaphorical or the audience is not expected to perform the action"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
