spec_version: 1
id: line-md-cloud-twotone
name: "Cloud Reveal (Twotone)"
description: "A compact cloud icon uses draw-in motion to illustrate software, devices, cloud systems, files, data, or digital infrastructure."
surfaces: [video]
category: sticker-technology
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-technology
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["cloud", "draw-in", "technology", "digital", "system", "compact", "twotone"]
intent_keywords:
  - "cloud"
  - "cloud icon"
  - "cloud symbol"
  - "cloud computing"
  - "digital folder"
  - "computer monitor"
  - "technology infrastructure"
  - "online data"
  - "storage"
  - "platform"
  - "云"
  - "云计算"
  - "数据存储"
  - "数字文件夹"
  - "电脑显示器"
  - "技术"
best_for:
  - "A spoken reference to cloud needs a compact, immediately recognizable cue"
  - "The narration names a digital system, device, file, cloud service, or technical process"
avoid_when:
  - "The spoken meaning does not refer to cloud or a close synonym"
  - "A similarly named object is being discussed in a physical or weather context"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
