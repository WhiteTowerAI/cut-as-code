spec_version: 1
id: line-md-bell-filled
name: "Bell Reveal (Filled)"
description: "A compact bell icon uses draw-in, rotation, looping motion to illustrate a notification, reminder, subscription prompt, or incoming update."
surfaces: [video]
category: sticker-notification
tech: [svg]
canvas: [video]
target: [overlay]
intent: sticker-notification
runtime: ["svg-smil"]
export: [skill, html]
dependencies: []
tags: ["bell", "draw-in", "rotation", "looping", "notification", "reminder", "attention", "compact", "filled"]
intent_keywords:
  - "bell"
  - "bell icon"
  - "bell symbol"
  - "notifications"
  - "subscribe"
  - "reminder"
  - "incoming"
  - "update"
  - "received"
  - "bell animation"
  - "铃铛"
  - "通知"
  - "订阅"
  - "提醒"
  - "更新"
  - "收到"
best_for:
  - "A spoken reference to bell needs a compact, immediately recognizable cue"
  - "A speaker asks viewers to subscribe, enable notifications, or notice a reminder"
avoid_when:
  - "The spoken meaning does not refer to bell or a close synonym"
  - "The cue communicates immediate physical danger rather than a routine notification"
restraint:
  max_per_view: 1
  notes: "Use as one selective semantic sticker; keep the full animated path outside visible faces."
motion:
  duration_ms: 6000
  easing: linear
  reduced_motion: freeze
  gpu_safe: true
entry: preview.html
implementations:
  - tech: svg-smil
    files: ["icon.svg", "upstream-icon.json"]
    usage: "Materialize the converted HyperFrames directory, then adapt placement, scale, palette, and timing to the shot."
license:
  spdx: MIT
  upstream: "https://github.com/cyberalien/line-md/blob/2ed22555cee9c1e50d4269865681d01ee8cffd7c/line-md.json"
  attribution_required: true
author:
  name: "Vjacheslav Trushkin"
  url: "https://github.com/cyberalien/line-md"
version: 3.0.5
