<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorts candidate review</title>
  <style>
    :root { --bg: #151719; --band: #1d2023; --surface: #24282b; --line: #3b4145; --text: #f2eee5; --muted: #aeb4b7; --accent: #4fc3b4; --warning: #f3bd5b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Arial, sans-serif; }
    button, input, textarea { font: inherit; }
    button, textarea, .delivery label { min-height: 38px; }
    button { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 7px 12px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto 64px; }
    .toolbar { position: sticky; z-index: 4; top: 0; display: grid; grid-template-columns: auto minmax(250px, 1fr) auto; gap: 14px; align-items: center; padding: 12px max(16px, calc((100vw - 1180px) / 2)); border-bottom: 1px solid var(--line); background: var(--band); }
    #review-status { white-space: nowrap; }
    .delivery { display: flex; flex-wrap: wrap; gap: 8px 18px; border: 0; margin: 0; padding: 0; }
    .delivery legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .delivery label { display: inline-flex; align-items: center; gap: 7px; }
    .toolbar-actions { display: flex; gap: 8px; }
    #copy-summary { border-color: var(--accent); background: var(--accent); color: #071c19; font-weight: 700; }
    #review-errors { color: var(--warning); min-height: 24px; padding: 8px 0; }
    .intro { padding: 24px 0 10px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    .candidate-row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; padding: 20px 0; border-top: 1px solid var(--line); }
    .candidate-row:first-child { border-top: 0; }
    .select-candidate { width: 22px; height: 22px; margin-top: 4px; accent-color: var(--accent); }
    .candidate-head { display: flex; justify-content: space-between; gap: 16px; }
    .candidate-head h2 { margin: 0; font-size: 19px; letter-spacing: 0; }
    .reference, .muted { color: var(--muted); }
    .facts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 8px 0 14px; }
    .warnings { color: var(--warning); }
    .excerpt { margin: 8px 0 14px; white-space: pre-wrap; }
    details { border-top: 1px solid var(--line); padding-top: 10px; }
    summary { min-height: 38px; cursor: pointer; padding: 8px 0; }
    .scores { width: 100%; border-collapse: collapse; }
    .scores th, .scores td { padding: 7px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    .frames { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    figure { margin: 0; }
    .frame-button { width: 100%; padding: 0; background: #090a0b; }
    .frame-button img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
    figcaption { padding-top: 5px; color: var(--muted); }
    .revision { border-top: 1px solid var(--line); padding: 20px 0; }
    .revision label { display: block; font-weight: 700; }
    #revision-feedback, #summary-output { width: 100%; margin-top: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 9px; resize: vertical; }
    #copy-revision { margin-top: 8px; }
    #summary-output { min-height: 96px; }
    dialog { width: min(1100px, calc(100% - 32px)); border: 1px solid var(--line); padding: 0; background: var(--bg); color: var(--text); }
    dialog::backdrop { background: rgb(0 0 0 / .82); }
    .dialog-bar { display: flex; justify-content: flex-end; padding: 8px; }
    #dialog-image { display: block; width: 100%; max-height: calc(100vh - 100px); object-fit: contain; }
    @media (max-width: 1100px) { .toolbar { grid-template-columns: 1fr auto; } .delivery { grid-column: 1 / -1; grid-row: 2; } }
    @media (max-width: 780px) { .shell { width: min(1180px, calc(100% - 20px)); } .toolbar { position: sticky; grid-template-columns: 1fr; padding: 10px; } .delivery, .toolbar-actions { grid-column: 1; grid-row: auto; } .toolbar-actions button { flex: 1; } .candidate-head { display: block; } .frames { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <form id="review-form">
    <div class="toolbar">
      <strong id="review-status" aria-live="polite">0 selected / max 5</strong>
      <fieldset class="delivery">
        <legend>Delivery</legend>
        <label><input type="radio" name="delivery" value="horizontal_only"> Horizontal only</label>
        <label><input type="radio" name="delivery" value="horizontal_and_vertical"> Horizontal and vertical</label>
      </fieldset>
      <div class="toolbar-actions"><button id="copy-summary" type="button" disabled>Copy summary</button></div>
    </div>
    <main class="shell">
      <header class="intro"><h1>Shorts candidate review</h1><p class="muted" id="review-reference"></p></header>
      <div id="review-errors" role="alert" aria-live="assertive"></div>
      <section id="candidate-list" aria-label="Candidates"></section>
      <section class="revision">
        <label for="revision-feedback">Changes requested</label>
        <textarea id="revision-feedback" rows="3"></textarea>
        <button id="copy-revision" type="button" disabled>Copy revision</button>
      </section>
      <label for="summary-output">Review summary</label>
      <textarea id="summary-output" rows="4" readonly></textarea>
    </main>
  </form>
  <dialog id="preview-dialog" aria-label="Candidate frame preview">
    <div class="dialog-bar"><button id="close-preview" type="button" aria-label="Close preview">Close</button></div>
    <img id="dialog-image" alt="">
  </dialog>
  <script>
    const REVIEW_DATA_B64 = "__SHORTS_CANDIDATE_REVIEW_DATA__";
    const data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(REVIEW_DATA_B64), c => c.charCodeAt(0))));
    const form = document.querySelector("#review-form");
    const list = document.querySelector("#candidate-list");
    const status = document.querySelector("#review-status");
    const errors = document.querySelector("#review-errors");
    const copyButton = document.querySelector("#copy-summary");
    const revisionButton = document.querySelector("#copy-revision");
    const feedback = document.querySelector("#revision-feedback");
    const output = document.querySelector("#summary-output");
    const dialog = document.querySelector("#preview-dialog");
    const dialogImage = document.querySelector("#dialog-image");
    let lastTrigger = null;
    const esc = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
    document.querySelector("#review-reference").textContent = `Review: ${data.reviewId}`;
    list.innerHTML = data.candidates.map(candidate => `<article class="candidate-row">
      <div><input class="select-candidate" type="checkbox" value="${esc(candidate.reference)}" aria-label="Select ${esc(candidate.reference)}"></div>
      <div><header class="candidate-head"><h2>#${candidate.rank} ${esc(candidate.title)}</h2><span class="reference">${esc(candidate.reference)}</span></header>
      <div class="facts"><span>Scene: ${esc(candidate.sceneType)}</span><span>Program: ${esc(candidate.startTime)} - ${esc(candidate.endTime)}</span><span>Duration: ${esc(candidate.duration)}s</span><span>Score: ${esc(candidate.score)}</span><span class="warnings">Warnings: ${esc(candidate.warnings.join(", ") || "None")}</span></div>
      <p class="excerpt">${esc(candidate.transcriptExcerpt)}</p><p><strong>Editorial reason:</strong> ${esc(candidate.editorialReason)}</p>
      <details><summary>Six-dimension score details</summary><table class="scores"><thead><tr><th>Dimension</th><th>Score</th><th>Reason</th></tr></thead><tbody>${candidate.scoreDetails.map(item => `<tr><td>${esc(item.name)}</td><td>${esc(item.score)}</td><td>${esc(item.reason)}</td></tr>`).join("")}</tbody></table></details>
      <div class="frames">${candidate.frames.map(frame => `<figure><button class="frame-button" type="button" data-src="${esc(frame.src)}" data-alt="${esc(frame.alt)}" aria-haspopup="dialog"><img src="${esc(frame.src)}" alt="${esc(frame.alt)}"></button><figcaption>${esc(frame.label)} · ${esc(frame.time)}s</figcaption></figure>`).join("")}</div></div>
    </article>`).join("");
    function selected() { return [...form.querySelectorAll(".select-candidate:checked")]; }
    function update() {
      const count = selected().length;
      const delivery = form.querySelector('input[name="delivery"]:checked');
      status.textContent = `${count} selected / max 5`;
      copyButton.disabled = count < 1 || count > 5 || !delivery;
      revisionButton.disabled = !feedback.value.trim();
    }
    form.addEventListener("change", event => {
      if (event.target.classList.contains("select-candidate") && selected().length > 5) {
        event.target.checked = false;
        errors.textContent = "Maximum 5 candidates. The sixth selection was not added.";
        event.target.setAttribute("aria-invalid", "true");
      } else { errors.textContent = ""; event.target.removeAttribute("aria-invalid"); }
      update();
    });
    feedback.addEventListener("input", update);
    async function copy(text) {
      output.value = text;
      try { await navigator.clipboard.writeText(text); }
      catch (_) { output.focus(); output.select(); document.execCommand("copy"); }
    }
    copyButton.addEventListener("click", () => copy(`Shorts candidate review\nReview: ${data.reviewId}\nCandidates: ${selected().map(item => item.value).join(", ")}\nDelivery: ${form.querySelector('input[name="delivery"]:checked').value}`));
    revisionButton.addEventListener("click", () => copy(`Shorts candidate review\nReview: ${data.reviewId}\nDecision: revise\nChanges: ${feedback.value.trim()}`));
    list.addEventListener("click", event => { const trigger = event.target.closest(".frame-button"); if (!trigger) return; lastTrigger = trigger; dialogImage.src = trigger.dataset.src; dialogImage.alt = trigger.dataset.alt; dialog.showModal(); });
    document.querySelector("#close-preview").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); });
    dialog.addEventListener("close", () => lastTrigger?.focus({preventScroll: true}));
    update();
  </script>
</body>
</html>
