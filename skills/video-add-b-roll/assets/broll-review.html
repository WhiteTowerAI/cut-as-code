<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B-roll candidate review</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1a1a1e;color:#e8e8ea;font:14px/1.45 system-ui,sans-serif}
main{max-width:1180px;margin:auto;padding:24px}
header{border-bottom:1px solid #3a3a45;padding-bottom:14px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0 0 8px}fieldset{border:0;padding:0;margin:0}
.shot{padding:22px 0;border-bottom:1px solid #3a3a45}.shot-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.context{border-left:4px solid #507aa2;background:#202027;padding:12px 14px;margin-bottom:14px}.transcript{font-size:16px;margin:8px 0}.program-state{font-weight:600;margin:10px 0}
.timing-grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:10px;margin:12px 0}.timing-field{display:grid;gap:4px}.time-stepper{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;gap:6px;align-items:center}.time-stepper input{text-align:center;font-variant-numeric:tabular-nums}.timing-adjust,.icon-button{padding:7px 0;min-width:36px}.timing-field input,.segment-grid input,.segment-grid select{width:100%;min-width:0}.mapping{overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:250px 1fr;gap:20px}.source,img,video{width:100%;background:#101014;max-height:250px;object-fit:contain}.choices{display:grid;gap:10px}
.candidate{border:1px solid #3a3a45;padding:12px;border-radius:4px;background:#202027}.candidate:focus-within{outline:3px solid #507aa2;outline-offset:2px}.candidate.selected{border-color:#c15f3c}.analysis{margin:8px 0;padding:8px;border-left:3px solid #507aa2;background:#282832}.similarity{margin:8px 0;padding:8px;border-left:3px solid #d4a779;background:#2a2823}.scores{display:flex;flex-wrap:wrap;gap:4px 12px}
.segment-editor{margin-top:16px;border-top:1px solid #3a3a45;padding-top:14px}.timeline-bar{display:flex;width:100%;height:38px;border:1px solid #4c4c59;background:#202027;overflow:hidden;margin:10px 0}.timeline-segment{display:flex;align-items:center;justify-content:center;min-width:1px;font-weight:700;font-size:12px;overflow:hidden}.timeline-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.segment-tone-orange{background:#c15f3c;color:#fff}.segment-tone-sand{background:#d4a779;color:#1a1a1e}.segment-tone-stone{background:#7e786d;color:#fff}
.segments-list{height:390px;overflow:auto;border-top:1px solid #3a3a45;border-bottom:1px solid #3a3a45}.segments-empty{padding:24px 0;color:#9a9aa2}.segment-row{padding:14px 0;border-bottom:1px solid #3a3a45}.segment-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.segment-title{font-weight:700;overflow-wrap:anywhere}.order-actions{display:flex;gap:6px;flex:0 0 auto}.segment-grid{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:10px;margin-top:10px}.boundary-row{display:flex;align-items:center;gap:6px;margin-top:10px}.boundary-row button{width:36px;padding:6px 0}.fit-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.duration-state{font-weight:600;overflow-wrap:anywhere}.duration-state.valid{color:#78b693}.duration-state.invalid{color:#ef8a70}.warning{color:#d4a779}.timing-invalid{border-color:#ef8a70!important;box-shadow:0 0 0 2px rgba(239,138,112,.2)}
.technical{margin-top:8px}.technical summary{cursor:pointer;font-weight:600}.technical p{margin:6px 0}.technical pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202027;padding:8px;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}.provenance{margin-top:8px}.provenance-line{margin:3px 0}.provenance a{color:#86b4e0}
.composite-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:18px}.preview-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.subshot{padding:16px 0;border-top:1px solid #3a3a45}.subshot:first-child{border-top:0}.evidence-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.evidence-frame{margin:0}.evidence-frame img{height:112px;object-fit:cover}.evidence-frame figcaption{margin-top:3px}.keyframes{display:grid;gap:4px;margin:8px 0}.clearance-pass{color:#78b693}.clearance-fallback{color:#d4a779}.anchor-previews{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.locked-media{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{display:block;font-weight:600}input,textarea,select,button{font:inherit}input,textarea,select{border:1px solid #4c4c59;border-radius:3px;padding:7px;background:#202027;color:#e8e8ea}textarea{width:100%;min-height:84px}.review-output{padding-top:20px}.decision-list{display:grid;gap:4px;margin:8px 0 16px}.decision-row{padding:5px 0;border-bottom:1px solid #3a3a45;overflow-wrap:anywhere}.intent{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 16px}.intent label{display:flex;align-items:center;gap:6px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:8px 12px;border:1px solid #4c4c59;border-radius:4px;background:#282832;color:#e8e8ea;cursor:pointer}button.primary{background:#507aa2;border-color:#507aa2;color:#fff;font-weight:600}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #86b4e0;outline-offset:2px}.error{color:#ef8a70;font-weight:600}.status{color:#78b693;font-weight:600}.meta{color:#9a9aa2;font-size:12px;overflow-wrap:anywhere}.hidden{display:none}.receipt{margin-top:12px;min-height:180px;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){main{padding:16px}.grid,.composite-grid{grid-template-columns:1fr}.segment-grid{grid-template-columns:1fr 1fr}.segments-list{height:440px}.actions button{flex:1 1 140px}}@media(max-width:600px){.timing-grid,.preview-band,.anchor-previews{grid-template-columns:1fr}.segment-grid{grid-template-columns:1fr 1fr}}@media(max-width:440px){.segment-grid{grid-template-columns:1fr}.shot-head,.segment-head,.fit-row{display:block}.order-actions{margin-top:8px}.segments-list{height:auto;max-height:560px}}
</style>
<main>
  <header><h1 id="page-title">B-roll candidate review</h1><p id="summary" class="meta"></p></header>
  <form id="review" novalidate>
    <div id="shots"></div>
    <section class="review-output" aria-labelledby="decision-heading">
      <h2 id="decision-heading">Decision summary</h2>
      <p id="decision-progress" class="meta"></p>
      <div id="decision-summary" class="decision-list"></div>
      <label for="modification-notes">Modification notes <span class="meta">Approve: leave blank. Request changes: required.</span></label>
      <textarea id="modification-notes"></textarea>
      <fieldset class="intent">
        <legend class="sr-only">Submission intent</legend>
        <label><input id="intent-approve" type="radio" name="submission-intent" value="approve"> <span id="approve-label">Approve</span></label>
        <label><input id="intent-request" type="radio" name="submission-intent" value="request_revision"> Request changes</label>
      </fieldset>
      <p id="errors" class="error" aria-live="polite"></p>
      <div class="actions">
        <button id="copy" class="primary" type="button" title="Copy review JSON" aria-label="Copy review JSON" disabled>Copy</button>
        <button id="download" type="button" disabled>Download JSON</button>
        <span id="action-status" class="status" aria-live="polite"></span>
      </div>
      <label for="receipt" class="sr-only">Review JSON</label>
      <textarea id="receipt" class="receipt hidden" readonly aria-label="Review JSON"></textarea>
    </section>
  </form>
</main>
<script>
const data=JSON.parse(atob('__BROLL_REVIEW_DATA__'));
const HUMAN_APPROVAL_RATIONALE='Explicit user action approved the exact configuration shown in this review.';
const HUMAN_SELECTION_APPROVAL_RATIONALE='Explicit user action approved the exact B-roll selection shown in this review.';
const PLAYBACK_RATES=[0.5,1,1.5,2];
const SEGMENT_TONES=['orange','sand','stone'];
const SEGMENT_COARSE_STEP_S=0.1;
const PROGRAM_STEP=0.5;
const frameDuration=data.timeline.fps.den/data.timeline.fps.num;
const coarseStepFrames=Math.max(1,Math.round(SEGMENT_COARSE_STEP_S/frameDuration));
const form=document.querySelector('#review'),shots=document.querySelector('#shots'),errors=document.querySelector('#errors'),copyButton=document.querySelector('#copy'),downloadButton=document.querySelector('#download'),decisionSummary=document.querySelector('#decision-summary'),decisionProgress=document.querySelector('#decision-progress'),revisionNotes=document.querySelector('#modification-notes'),approveIntent=document.querySelector('#intent-approve'),requestIntent=document.querySelector('#intent-request'),receipt=document.querySelector('#receipt'),actionStatus=document.querySelector('#action-status');
const shotStates=new Map();
let stableReceipt={signature:'',timestamp:'',bytes:''};
const totalShots=data.shots.length+data.pre_skipped_ids.length;
const selectionMode=data.review_mode==='selection',compositeMode=data.review_mode==='composite';
approveIntent.value=data.approval_intent;
if(selectionMode)document.querySelector('#approve-label').textContent='Approve B-roll selection';
if(compositeMode){document.querySelector('#page-title').textContent='Speaker inset composite review';document.querySelector('#approve-label').textContent='Approve speaker inset composite'}
document.querySelector('#summary').textContent=`${totalShots} shots | ${data.review_id}`;
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function finite(value){const number=Number(value);return Number.isFinite(number)?number:null}
function clean(value){const number=Number(value);return Number.isFinite(number)?Number(number.toFixed(9)):null}
function fmt(value){return Number(value).toFixed(2)}
function snap(value){const number=finite(value);return number===null?null:Math.round(number/frameDuration)*frameDuration}
function frameIndex(value){return Math.round(Number(value)/frameDuration)}
function frameSeconds(frame){return clean(frame*frameDuration)}
function timecode(value){const total=Math.max(0,Math.round(Number(value)*100)),hours=Math.floor(total/360000),minutes=Math.floor(total%360000/6000),seconds=Math.floor(total%6000/100),hundredths=total%100,prefix=hours?`${String(hours).padStart(2,'0')}:`:'';return `${prefix}${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(hundredths).padStart(2,'0')}`}
if(compositeMode){
function roiLine(keyframe){const roi=keyframe.roi;return `${fmt(keyframe.program_time_s)}s | x ${fmt(roi.x)} | y ${fmt(roi.y)} | w ${fmt(roi.width)} | h ${fmt(roi.height)}`}
function evidenceMarkup(subshot){return subshot.evidence_frames.map(frame=>`<figure class="evidence-frame"><img alt="A-roll evidence at ${esc(fmt(frame.program_time_s))} seconds" src="${esc(frame.path)}"><figcaption class="meta">${esc(fmt(frame.program_time_s))}s</figcaption></figure>`).join('')}
function pixelBudgetMarkup(budget){if(!budget)return '<p class="meta">Pixel risk: not applicable</p>';const checkpoints=budget.checkpoints.map(item=>`<div>${esc(item.role.replace('_','-'))} ${fmt(item.program_time_s)}s | input ${fmt(item.input_crop_px.width)} x ${fmt(item.input_crop_px.height)} px | output ${esc(item.output_content_px.width)} x ${esc(item.output_content_px.height)} px | ${fmt(item.scale_factor)}x</div>`).join('');return `<p><strong>Pixel risk:</strong> ${esc(budget.pixel_risk)} | maximum ${fmt(budget.max_scale_factor)}x</p><div class="keyframes meta">${checkpoints}</div>`}
function legibilityMarkup(checks){if(!checks.length)return '<div class="meta">Not applicable</div>';return checks.map(item=>{const role=item.role.replace('_','-'),time=item.program_time_s===undefined?'':` ${fmt(item.program_time_s)}s`,detail=item.observation||item.reason;return `<div><strong>${esc(role)}</strong>${esc(time)} | ${esc(item.status||'checked')} | ${esc(detail)}</div>`}).join('')}
function subshotMarkup(subshot){const clearanceClass=subshot.clearance_status==='pass'?'clearance-pass':'clearance-fallback',anchor=subshot.anchor||'none',checked=subshot.checked_anchors.length?subshot.checked_anchors.join(', '):'none',keyframes=subshot.keyframes.length?subshot.keyframes.map(keyframe=>`<div>${esc(roiLine(keyframe))}</div>`).join(''):'<div>None</div>';return `<section class="subshot"><div class="shot-head"><h3>${esc(subshot.id)}</h3><span class="${clearanceClass}">${esc(subshot.display_mode)} / ${esc(subshot.clearance_status)}</span></div><p class="meta">${timecode(subshot.program_range.start_s)} - ${timecode(subshot.program_range.end_s)} | speaker ${esc(subshot.speaker_status)} | anchor ${esc(anchor)} | subject_legibility ${esc(subshot.subject_legibility)}</p><p>${esc(subshot.speaker_rationale)}</p><div class="evidence-strip">${evidenceMarkup(subshot)}</div><details class="technical"><summary>ROI keyframes</summary><div class="keyframes meta">${keyframes}</div></details><details class="technical"><summary>Final-size evidence</summary>${pixelBudgetMarkup(subshot.pixel_budget)}<p><strong>Legibility checks:</strong> ${esc(subshot.legibility_rationale||'not applicable')}</p><div class="keyframes meta">${legibilityMarkup(subshot.legibility_checks)}</div></details><p><strong>Clearance:</strong> ${esc(subshot.clearance_rationale)}</p><p class="meta">Checked anchors: ${esc(checked)}</p></section>`}
function anchorMarkup(shot){return Object.entries(shot.anchor_previews).map(([anchor,binding])=>`<div><h3>${esc(anchor)}</h3><video controls preload="metadata" src="${esc(binding.path)}"></video></div>`).join('')}
function assessmentMarkup(recommendation){return Object.entries(recommendation.preset_assessments).map(([preset,status])=>`${esc(preset)}: ${esc(status)}`).join(' | ')}
const strategy=data.speaker_layout_strategy,strategySection=document.createElement('section');strategySection.className='shot';strategySection.innerHTML=`<div class="shot-head"><h2>Project layout strategy</h2><span class="meta">Primary ${esc(strategy.primary_preset)}</span></div><p>${esc(strategy.rationale)}</p><p class="meta">Used presets: ${esc(strategy.used_presets.join(', '))} | speaker width ratio ${fmt(data.speaker_style.width_ratio)} | ${esc(data.speaker_style.shape)} | border ${esc(data.speaker_style.border.color)} / ${esc(data.speaker_style.border.width_px)}px</p>`;shots.append(strategySection)
for(const shot of data.shots){
  const section=document.createElement('section');
  const candidates=shot.selected_candidates.map(candidate=>`<div><h3>${esc(candidate.id)}</h3>${candidate.media_type==='video'?`<video controls preload="metadata" src="${esc(candidate.path)}"></video>`:`<img alt="Locked candidate ${esc(candidate.id)}" src="${esc(candidate.path)}">`}</div>`).join('');
  const recommendation=shot.layout_recommendation,alternate=shot.alternate_preview?`<div><h3>Low-confidence alternate: ${esc(shot.alternate_preview.preset)} / ${esc(shot.alternate_preview.anchor)}</h3><video controls preload="metadata" src="${esc(shot.alternate_preview.path)}"></video></div>`:'';
  section.className='shot';
  section.innerHTML=`<div class="shot-head"><h2>${esc(shot.id)}</h2><span class="meta">${timecode(shot.program_range.start_s)} - ${timecode(shot.program_range.end_s)}</span></div><p><strong>Agent recommendation:</strong> ${esc(recommendation.preset)} / ${esc(recommendation.anchor)} / ${esc(recommendation.confidence)} confidence</p><p>${esc(recommendation.rationale)}</p><p class="meta"><strong>Preset assessments:</strong> ${assessmentMarkup(recommendation)}</p><p><strong>Continuity:</strong> ${esc(shot.continuity.risk)} / ${esc(shot.continuity.decision)} | ${esc(shot.continuity.rationale)}</p><div class="preview-band"><div><h3>Recommended composite preview</h3><video controls preload="metadata" src="${esc(shot.preview.path)}"></video></div>${alternate}</div><div class="composite-grid"><div><h3>Speaker evidence and decisions</h3>${shot.subshots.map(subshotMarkup).join('')}</div><div><details open class="technical"><summary>Supported anchor previews</summary><div class="anchor-previews">${anchorMarkup(shot)}</div></details><details class="technical"><summary>Locked B-roll</summary><video controls preload="metadata" src="${esc(shot.base_broll.path)}"></video><div class="locked-media">${candidates}</div><pre>${esc(JSON.stringify(shot.locked_selection,null,2))}</pre></details></div></div>`;
  shots.append(section);
}
for(const media of document.querySelectorAll('img,video'))media.addEventListener('error',()=>{media.dataset.failed='true';checkComposite()});
function selectedCompositeIntent(){return form.querySelector('input[name="submission-intent"]:checked')?.value||''}
function syncCompositeIntent(){if(revisionNotes.value.trim()){requestIntent.checked=true;approveIntent.checked=false;approveIntent.disabled=true;return 'request_revision'}approveIntent.disabled=false;return selectedCompositeIntent()}
function compositeValidation(){const intent=syncCompositeIntent();if([...document.querySelectorAll('img,video')].some(media=>media.dataset.failed==='true'))return 'A review asset failed to load.';if(!intent)return 'Choose Approve or Request changes.';if(intent==='request_revision'&&!revisionNotes.value.trim())return 'Modification notes are required for a composite revision.';return ''}
function updateCompositeSummary(){const intent=syncCompositeIntent();decisionProgress.textContent=`${totalShots} / ${totalShots} locked`;const rows=data.pre_skipped_ids.map(id=>`${esc(id)}: skip (pre-skipped)`).concat(data.shots.map(shot=>`${esc(shot.id)}: ${shot.subshots.map(subshot=>`${esc(subshot.display_mode)}${subshot.anchor?` at ${esc(subshot.anchor)}`:''}`).join(' | ')}`),[`Intent: ${esc(intent||'required')}`,`Modification notes: ${esc(revisionNotes.value.trim()||'none')}`]);decisionSummary.innerHTML=rows.map(row=>`<div class="decision-row">${row}</div>`).join('')}
function checkComposite(){const message=compositeValidation();errors.textContent=message;copyButton.disabled=!!message;downloadButton.disabled=!!message;updateCompositeSummary();return !message}
function buildCompositeReceipt(commit,action){if(!checkComposite())return null;const intent=syncCompositeIntent(),signature=JSON.stringify({intent,notes:revisionNotes.value});if(stableReceipt.signature!==signature){const value={review_id:data.review_id,submission_intent:intent,approval_scope:data.approval_scope,explicit_user_action:true,revision_notes:revisionNotes.value,plan_sha256:data.plan_sha256,candidate_manifest_sha256:data.candidate_manifest_sha256,review_video_sha256:data.review_video_sha256,timeline_fps:data.timeline.fps,timestamp:new Date().toISOString(),...data.speaker_bindings};if(intent==='approve'){value.review_stage='composite';value.rationale=HUMAN_APPROVAL_RATIONALE;value.rationale_source='review_ui_explicit_action'}stableReceipt={signature,timestamp:value.timestamp,bytes:JSON.stringify(value,null,2)}}if(commit){receipt.value=stableReceipt.bytes;receipt.classList.remove('hidden');actionStatus.textContent=action==='copy'?'Review JSON ready.':'Review JSON downloaded.'}return stableReceipt.bytes}
copyButton.addEventListener('click',async()=>{const bytes=buildCompositeReceipt(true,'copy');if(!bytes)return;try{await navigator.clipboard.writeText(bytes);actionStatus.textContent='Copied.'}catch(error){receipt.focus();receipt.select();actionStatus.textContent='Review JSON ready.'}});
downloadButton.addEventListener('click',()=>{const bytes=buildCompositeReceipt(true,'download');if(!bytes)return;const blob=new Blob([bytes],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`b-roll-review-${data.review_id}.json`;link.click();URL.revokeObjectURL(link.href)});
form.addEventListener('input',()=>{stableReceipt={signature:'',timestamp:'',bytes:''};actionStatus.textContent='';checkComposite()});
form.addEventListener('change',()=>{stableReceipt={signature:'',timestamp:'',bytes:''};actionStatus.textContent='';checkComposite()});
checkComposite();
}else{
function inputNumber(input){return finite(input.dataset.value??input.value)}
function setInputNumber(input,value){const number=clean(value);input.dataset.value=number;input.value=fmt(number)}
function rangesEqual(a,b){return !!a&&!!b&&Math.abs(a.start_s-b.start_s)<=1e-6&&Math.abs(a.end_s-b.end_s)<=1e-6}
function equalAllocation(totalFrames,count){if(!Number.isInteger(totalFrames)||!Number.isInteger(count)||count<1||count>3||totalFrames<count)return [];const base=Math.floor(totalFrames/count),values=Array(count).fill(base);values[count-1]+=totalFrames-base*count;return values}
function similarity(value){const matches=Array.isArray(value.similar_footage)?value.similar_footage:[];if(!matches.length)return '';return `<div class="similarity"><strong>Similar footage also appears in:</strong><br>${matches.map(item=>`${esc(item.shot_id)} / candidate ${esc(item.candidate_id)}`).join('<br>')}</div>`}
function analysis(candidate){const value=candidate.ranking;if(!value)return '';const scores=Object.entries(value.scores).map(([key,score])=>`<span>${esc(key)}: ${esc(score)}</span>`).join('');const warnings=value.warnings.length?`<p class="warning">Warnings: ${esc(value.warnings.join(' | '))}</p>`:'';return `<div class="analysis"><strong>Rank ${esc(value.rank)}</strong><div class="scores meta">${scores}</div>${warnings}<p>${esc(value.rationale)}</p>${similarity(value)}</div>`}
function transcriptMarkup(words){const text=words.map(word=>String(word.word||'').trim()).filter(Boolean).join(' ');return text?esc(text):'<span class="error">No complete mapped word in this range.</span>'}
function safeHttpUrl(value){try{const url=new URL(value);return url.protocol==='http:'||url.protocol==='https:'?url.href:''}catch(error){return ''}}
function sourceLabel(value){return value==='pexels'?'Pexels':value==='local'?'Local media':value==='external-generated'?'External generated media':value||'Unknown source'}
function provenanceMarkup(candidate){const value=candidate.provenance||{},dimensions=value.dimensions,facts=[sourceLabel(value.source_type)];if(value.creator)facts.push(value.creator);if(dimensions?.width&&dimensions?.height)facts.push(`${dimensions.width} x ${dimensions.height}`);if(Number.isFinite(Number(candidate.duration_s)))facts.push(`${fmt(candidate.duration_s)}s`);const sourceUrl=safeHttpUrl(value.source_url),licenseUrl=safeHttpUrl(value.license_url),termsUrl=safeHttpUrl(value.terms_url),links=[];if(value.license)links.push(licenseUrl?`<a href="${esc(licenseUrl)}" target="_blank" rel="noopener noreferrer">${esc(value.license)}</a>`:esc(value.license));if(sourceUrl)links.push(`<a href="${esc(sourceUrl)}" target="_blank" rel="noopener noreferrer">View source</a>`);if(termsUrl)links.push(`<a href="${esc(termsUrl)}" target="_blank" rel="noopener noreferrer">View terms</a>`);return `<div class="provenance"><p class="meta provenance-line">${facts.map(esc).join(' | ')}</p>${links.length?`<p class="meta provenance-line">${links.join(' | ')}</p>`:''}<details class="technical"><summary>Technical provenance</summary><pre>${esc(JSON.stringify(value,null,2))}</pre></details></div>`}
function candidateFor(shot,id){return shot.candidates.find(candidate=>candidate.id===id)}
function candidateTone(shot,candidateId){const index=shot.candidates.findIndex(candidate=>candidate.id===candidateId);return SEGMENT_TONES[(index<0?0:index)%SEGMENT_TONES.length]}
function mappedSourceRanges(program){const result=[];for(const clip of data.timeline.clips){const start=Math.max(program.start_s,clip.program_range.start_s),end=Math.min(program.end_s,clip.program_range.end_s);if(!(end>start))continue;result.push({clip_id:clip.id,start_s:clean(clip.source_range.start_s+(start-clip.program_range.start_s)*clip.speed),end_s:clean(clip.source_range.start_s+(end-clip.program_range.start_s)*clip.speed)})}return result}

function updateSummary(){const decided=data.pre_skipped_ids.length+data.shots.filter(shot=>selectedEntry(shot,syncIntent()||'approve')).length;decisionProgress.textContent=`${decided} / ${totalShots} decided`;const rows=data.pre_skipped_ids.map(id=>`${esc(id)}: skip (pre-skipped)`).concat(data.shots.map(decisionLine),[`Intent: ${esc(syncIntent()||'required')}`,`Modification notes: ${esc(revisionNotes.value.trim()||'none')}`]);decisionSummary.innerHTML=rows.map(row=>`<div class="decision-row">${row}</div>`).join('')}
function check(){const message=validation();errors.textContent=message;copyButton.disabled=!!message;downloadButton.disabled=!!message;updateSummary();return !message}
function buildReviewReceipt(commit,action){if(!check())return null;const intent=syncIntent(),signature=JSON.stringify({intent,notes:revisionNotes.value,shots:data.shots.map(shot=>selectedEntry(shot,intent))});if(stableReceipt.signature!==signature){const value={review_id:data.review_id,submission_intent:intent,approval_scope:data.approval_scope,explicit_user_action:true,revision_notes:revisionNotes.value,plan_sha256:data.plan_sha256,candidate_manifest_sha256:data.candidate_manifest_sha256,review_video_sha256:data.review_video_sha256,timeline_fps:data.timeline.fps,timestamp:new Date().toISOString(),shots:data.pre_skipped_ids.map(id=>({id,decision:'skip'})).concat(data.shots.map(shot=>selectedEntry(shot,intent)))};if(intent==='approve'){value.rationale=HUMAN_APPROVAL_RATIONALE;value.rationale_source='review_ui_explicit_action'}else if(intent==='approve_selection'){value.rationale=HUMAN_SELECTION_APPROVAL_RATIONALE;value.rationale_source='review_ui_explicit_action'}stableReceipt={signature,timestamp:value.timestamp,bytes:JSON.stringify(value,null,2)}}if(commit){receipt.value=stableReceipt.bytes;receipt.classList.remove('hidden');actionStatus.textContent=action==='copy'?'Review JSON ready.':'Review JSON downloaded.'}return stableReceipt.bytes}
copyButton.addEventListener('click',async()=>{const bytes=buildReviewReceipt(true,'copy');if(!bytes)return;try{await navigator.clipboard.writeText(bytes);actionStatus.textContent='Copied.'}catch(error){receipt.focus();receipt.select();actionStatus.textContent='Review JSON ready.'}});
downloadButton.addEventListener('click',()=>{const bytes=buildReviewReceipt(true,'download');if(!bytes)return;const blob=new Blob([bytes],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`b-roll-review-${data.review_id}.json`;link.click();URL.revokeObjectURL(link.href)});
form.addEventListener('input',()=>{stableReceipt={signature:'',timestamp:'',bytes:''};actionStatus.textContent='';check()});
form.addEventListener('change',()=>{stableReceipt={signature:'',timestamp:'',bytes:''};actionStatus.textContent='';check()});
check();
}
</script>
</html>
