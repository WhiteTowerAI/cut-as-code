<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B-roll candidate review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#1b1f23;font:14px/1.4 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:24px}header{border-bottom:1px solid #d0d7de;padding-bottom:14px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}.shot{padding:20px 0;border-bottom:1px solid #d0d7de}.grid{display:grid;grid-template-columns:280px 1fr;gap:20px}.source,img,video{width:100%;background:#111;max-height:250px;object-fit:contain}.choices{display:grid;gap:10px}.candidate{border:1px solid #d0d7de;padding:10px}.candidate:focus-within{outline:3px solid #0969da;outline-offset:2px}label{display:block;font-weight:600}input,textarea,select,button{font:inherit}textarea{width:100%;min-height:84px}button{padding:8px 12px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #0969da;outline-offset:2px}.error{color:#b42318;font-weight:600}.meta{color:#57606a;font-size:12px;overflow-wrap:anywhere}.hidden{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
<main><header><h1>B-roll candidate review</h1><p id="summary" class="meta"></p></header><form id="review" novalidate><div id="shots"></div><label for="rationale">Rationale</label><textarea id="rationale" required></textarea><p id="errors" class="error" aria-live="polite"></p><button id="export" type="button" disabled>Export review</button></form></main>
<script>
const data=JSON.parse(atob('__BROLL_REVIEW_DATA__'));
const form=document.querySelector('#review'),shots=document.querySelector('#shots'),errors=document.querySelector('#errors'),exportButton=document.querySelector('#export');
document.querySelector('#summary').textContent=`${data.shots.length} shots | ${data.review_id}`;
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function option(shot,candidate,index){const id=`${shot.id}-${candidate.id}`,kind=candidate.media_type,trimEnd=Number(candidate.duration_s)||Math.max(.01,shot.program_range.end_s-shot.program_range.start_s);return `<div class="candidate"><label><input type="radio" name="${esc(shot.id)}" value="${esc(candidate.id)}"> Select ${esc(candidate.id)}</label>${kind==='video'?`<video controls preload="metadata" src="${esc(candidate.path)}"></video><label>Trim start <input class="trim-start" type="number" min="0" max="${trimEnd}" step="0.01" value="0"></label><label>Trim end <input class="trim-end" type="number" min="0" max="${trimEnd}" step="0.01" value="${trimEnd}"></label>`:`<img alt="Candidate ${esc(candidate.id)}" src="${esc(candidate.path)}"><label>Ken Burns direction <select class="ken-burns" required><option value="">Choose direction</option><option value="zoom-in">Zoom in</option><option value="pan-left">Pan left</option><option value="pan-right">Pan right</option></select></label>`}<p class="meta">${esc(JSON.stringify(candidate.provenance))}</p><p class="error media-error hidden">Media failed to load; approval is blocked.</p></div>`}
for(const shot of data.shots){const section=document.createElement('section');section.className='shot';section.innerHTML=`<h2>${esc(shot.id)}</h2><div class="grid"><div><img class="source" alt="Source frame for ${esc(shot.id)}" src="${esc(shot.source_frame.path)}"><p>${esc(shot.editorial_reason)}</p><p class="meta">${esc(shot.visual_intent)} | ${esc(JSON.stringify(shot.transcript_evidence))}</p><p class="meta">Queries: ${esc(shot.queries.join(' | '))}</p></div><div class="choices"><label><input type="radio" name="${esc(shot.id)}" value="skip"> Skip this shot</label>${shot.candidates.map((c,i)=>option(shot,c,i)).join('')}</div></div>`;shots.append(section)}
for(const media of document.querySelectorAll('img,video'))media.addEventListener('error',()=>{media.closest('.candidate')?.querySelector('.media-error')?.classList.remove('hidden');media.dataset.failed='true';check()});
function validation(){for(const shot of data.shots){const choice=form.querySelector(`input[name="${CSS.escape(shot.id)}"]:checked`);if(!choice)return 'Choose one option for every shot.';if(choice.value==='skip')continue;const candidate=shot.candidates.find(c=>c.id===choice.value),box=choice.closest('.candidate');if(candidate.media_type==='image'&&!box.querySelector('.ken-burns').value)return 'Select a Ken Burns direction.';if(candidate.media_type==='video'){const start=Number(box.querySelector('.trim-start').value),end=Number(box.querySelector('.trim-end').value),duration=Number(candidate.duration_s);if(!Number.isFinite(start)||!Number.isFinite(end)||!Number.isFinite(duration)||start<0||!(end>start)||end>duration)return 'Invalid video trim.'}}return ''}
function check(){const message=document.querySelector('[data-failed="true"]')?'Fix media load errors before export.':validation();errors.textContent=message;exportButton.disabled=!!message||!document.querySelector('#rationale').value.trim();return !!message}
form.addEventListener('change',check);document.querySelector('#rationale').addEventListener('input',check);
exportButton.addEventListener('click',()=>{if(check())return;const out={review_id:data.review_id,plan_sha256:data.plan_sha256,candidate_manifest_sha256:data.candidate_manifest_sha256,review_video_sha256:data.review_video_sha256,explicit_user_action:true,shots:data.pre_skipped_ids.map(id=>({id,decision:'skip'})),rationale:document.querySelector('#rationale').value.trim(),timestamp:new Date().toISOString()};for(const shot of data.shots){const choice=form.querySelector(`input[name="${CSS.escape(shot.id)}"]:checked`).value;if(choice==='skip'){out.shots.push({id:shot.id,decision:'skip'});continue}const c=shot.candidates.find(x=>x.id===choice),box=form.querySelector(`input[name="${CSS.escape(shot.id)}"][value="${CSS.escape(choice)}"]`).closest('.candidate'),entry={id:shot.id,decision:'select',candidate_id:choice};if(c.media_type==='video')entry.source_trim={start_s:Number(box.querySelector('.trim-start').value),end_s:Number(box.querySelector('.trim-end').value)};else entry.ken_burns={direction:box.querySelector('.ken-burns').value};out.shots.push(entry)}const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));link.download=`b-roll-review-${data.review_id}.json`;link.click();URL.revokeObjectURL(link.href)});
</script>
</html>
